<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN PYQ Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Shared page for both subject sites (the subject's text comes from SITE in its data file).
   Layout: one study column (max 920px). Warm hero with a progress ring, pill tabs, five unit tiles,
   then topics with one row per question; a row opens its own answer in place. */
:root{
  --bg:#fdc9e8; --surface:#fff3fa; --sunk:#fbd9ec; --ink:#6a1f50; --muted:#a04f7e; --line:#f3b3d6;
  --accent:#cc4a92; --aura:#db8cba; --aura2:#e6a6cd; --sun:#fff0f8; --good:#cc4a92; --hot:#cc4a92; --pill:#d9609f; --pill-ink:#ffffff;
  --heat-hi:#c93d8a; --heat-mid:#a565c8; --heat-lo:#e69cc3;
  --u1:#cf4a90; --u2:#b9529f; --u3:#9c62c4; --u4:#d5567c; --u5:#b14786;
  --shadow:0 1px 0 rgba(204,74,146,.06),0 12px 28px -16px rgba(180,60,130,.45);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#2a1226; --surface:#3a1b35; --sunk:#32162d; --ink:#ffe6f3; --muted:#e0a9c8; --line:#5a2e50;
  --accent:#ff8cc4; --aura:#8f3f73; --aura2:#a85089; --sun:#ffe6f3; --good:#ff8cc4; --hot:#ff8cc4; --pill:#ff8cc4; --pill-ink:#2a0a1c;
  --heat-hi:#ff8cc4; --heat-mid:#c9a2ff; --heat-lo:#b8758f;
  --u1:#ff8cc4; --u2:#f093e0; --u3:#c9a2ff; --u4:#ff9bb0; --u5:#e89bd4;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 26px -16px rgba(0,0,0,.7); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#2a1226; --surface:#3a1b35; --sunk:#32162d; --ink:#ffe6f3; --muted:#e0a9c8; --line:#5a2e50;
  --accent:#ff8cc4; --aura:#8f3f73; --aura2:#a85089; --sun:#ffe6f3; --good:#ff8cc4; --hot:#ff8cc4; --pill:#ff8cc4; --pill-ink:#2a0a1c;
  --heat-hi:#ff8cc4; --heat-mid:#c9a2ff; --heat-lo:#b8758f;
  --u1:#ff8cc4; --u2:#f093e0; --u3:#c9a2ff; --u4:#ff9bb0; --u5:#e89bd4;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 26px -16px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);margin:0}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);font-weight:600;font-variation-settings:"SOFT" 100;text-wrap:balance;margin:0;line-height:1.1}
h3{font-family:var(--body);text-wrap:balance;margin:0;line-height:1.3}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.u1{--u:var(--u1)}.u2{--u:var(--u2)}.u3{--u:var(--u3)}.u4{--u:var(--u4)}.u5{--u:var(--u5)}
.m{font-family:var(--mono);font-size:.92em}

/* hero */
header.top{padding-block:22px 6px}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:30px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;
  background:var(--bg);border:1px solid var(--line)}
.hero>*{position:relative}
.hero::before{content:"";position:absolute;right:-70px;top:50%;width:420px;height:420px;transform:translateY(-50%);border-radius:50%;filter:blur(22px);
  background:radial-gradient(circle,var(--aura2) 0 14%,var(--aura) 26% 34%,var(--aura2) 44%,var(--aura) 56%,transparent 70%)}
body{background-image:radial-gradient(520px 520px at 8% 78%,color-mix(in srgb,var(--aura) 45%,transparent),transparent 70%),radial-gradient(460px 460px at 96% 38%,color-mix(in srgb,var(--aura) 30%,transparent),transparent 70%);background-attachment:fixed}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wish{font:600 clamp(19px,3.4vw,25px)/1.25 var(--display);font-variation-settings:"SOFT" 100;color:var(--accent);margin-bottom:14px}
.wish b{font-weight:600;letter-spacing:.12em;margin-right:10px}
h1{font-size:clamp(32px,6.4vw,52px);margin-top:8px}
h1 i{color:var(--accent)}
.lede{color:var(--muted);max-width:46ch;margin:10px 0 0}
.cheer{display:inline-block;margin-top:14px;font-weight:700;background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:7px 14px;font-size:14px}
.themeb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;margin:14px 0 0 6px}
.ring{width:150px;height:150px;position:relative;flex:none;margin-right:24px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bgc{stroke:color-mix(in srgb,var(--sun) 40%,transparent)}
.ring .fg{stroke:var(--sun);transition:stroke-dashoffset .5s}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font:600 34px/1 var(--display);color:var(--sun)}
.ring span{font-size:12px;color:var(--sun);font-weight:600}
@media (max-width:560px){.hero{grid-template-columns:1fr;padding:22px 18px}.hero::before{right:auto;left:-90px;top:auto;bottom:-150px;transform:none}.ring{width:118px;height:118px;margin:0}}

/* tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px}
.tabs button:hover{border-color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}

main{padding-block:10px 70px}
section[hidden]{display:none}

/* unit tiles */
.units{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ut{all:unset;box-sizing:border-box;cursor:pointer;border-radius:18px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;
  background:color-mix(in srgb,var(--u) 13%,var(--surface));border:2px solid transparent}
.ut:hover{border-color:color-mix(in srgb,var(--u) 45%,transparent)}
.ut[aria-pressed="true"]{border-color:var(--u);box-shadow:var(--shadow)}
.ut:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ut .k{font:600 20px/1 var(--display);color:var(--u)}
.ut .n{font-size:12.5px;line-height:1.3;color:var(--ink);min-height:2.6em}
.ut .pb{height:6px;border-radius:3px;background:color-mix(in srgb,var(--u) 20%,var(--surface));overflow:hidden}
.ut .pb i{display:block;height:100%;background:var(--u);border-radius:3px}
.ut .c{font:600 11.5px var(--mono);color:var(--muted)}
.ut.all{--u:var(--ink)}
@media (max-width:760px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(80,40,10,.18)}
.filters select,.filters input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0}
.filters input[type=search]{flex:1 1 180px}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--muted);font-size:13.5px;margin:8px 2px 4px}
.fmeta label{display:flex;align-items:center;gap:6px;cursor:pointer}
.chipx{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.linkb{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;font-size:13.5px}

/* topic cards: closed by default, most repeated first; the questions inside each open their own answer */
.cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.tcard>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;width:100%;padding:16px 18px;cursor:pointer;align-items:start}
.tcard>button:hover{background:color-mix(in srgb,var(--u) 5%,var(--surface))}
.tcard>button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tcard .num{font:600 26px/1 var(--display);color:var(--u);min-width:34px;font-variant-numeric:tabular-nums}
.tcard .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard h3{font-size:17.5px;font-weight:700;margin:9px 0}
.tcard .pcs{display:flex;flex-wrap:wrap;gap:5px}
.pc{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pc.d{background:var(--sunk);color:var(--accent);border-color:transparent}
.tcard .pm{font:500 26px/1 var(--display);color:var(--u);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--u) 12%,var(--surface))}
.pill.rep{color:#fff;background:var(--accent);font-size:12px;padding:6px 10px}
.tbody{border-top:1px solid var(--line);padding:14px 16px 18px;background:color-mix(in srgb,var(--u) 4%,var(--surface))}
.tbody .lab{margin-bottom:10px}

/* topics and question rows */
.unit-h{margin:22px 0 4px}
.unit-h h2{font-size:27px;color:var(--u)}
.unit-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.topic{margin-top:18px}
.th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 2px 8px}
.th h3{font-size:17.5px;font-weight:700;flex:1 1 260px}
.pill{font:600 11.5px/1 var(--mono);padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.hot{color:var(--hot);background:color-mix(in srgb,var(--hot) 13%,var(--surface))}
.pill.u{color:var(--u);background:color-mix(in srgb,var(--u) 14%,var(--surface))}
.rows{display:flex;flex-direction:column;gap:8px}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;border-left:5px solid var(--u)}
.qrow.open{box-shadow:var(--shadow)}
.qh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:13px 14px;cursor:pointer;align-items:start}
.qh:hover{background:color-mix(in srgb,var(--u) 5%,var(--surface))}
.qh:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tick{all:unset;box-sizing:border-box;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:14px;font-weight:700;color:transparent;margin-top:1px}
.tick:hover{border-color:var(--good)}
.tick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qrow.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.qmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.qtext{line-height:1.7;min-width:0}
.qrow.done .qtext{color:var(--muted)}
.qtext .tw{margin:8px 0}
.chev{font-size:13px;font-weight:700;color:var(--u);white-space:nowrap;padding-top:2px}
.qa{border-top:1px dashed var(--line);padding:14px 16px 16px;min-width:0;background:color-mix(in srgb,var(--u) 4%,var(--surface))}
.lab{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--u);margin-bottom:10px}
.ans{min-width:0;max-width:74ch}
.ans p{margin:0 0 11px}
.ans ul,.ans ol{margin:0 0 11px;padding-left:22px}
.ans li{margin-bottom:5px}
.ans .f{font-family:var(--mono);font-size:13.5px;background:var(--sunk);border-left:3px solid var(--u);padding:8px 10px;border-radius:0 8px 8px 0}
.ans pre{font:13px/1.55 var(--mono);background:var(--sunk);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:0 0 11px}
.tw{overflow-x:auto;margin:0 0 11px}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:600}
td.m,th.m{font-family:var(--mono);font-size:.92em}
table.qt{min-width:0;font-family:var(--mono);font-size:13.5px;background:var(--surface)}
table.qt th,table.qt td{padding:5px 14px;text-align:center}
table.bits td,table.bits th{text-align:center;font-family:var(--mono);padding:5px 6px}
td.pb{color:var(--hot);font-weight:600}
details.more{margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.more summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
details.more .ans{padding:4px 12px 6px}
.doneb{border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;background:var(--good);color:var(--surface)}
.qrow.done .doneb{background:var(--sunk);color:var(--muted)}
.empty{color:var(--muted);padding:34px 0;text-align:center}

/* shared blocks */
.block{margin-bottom:30px}
.block>h2{font-size:27px;margin-bottom:4px}
.block>p.sub{color:var(--muted);margin:0 0 12px;max-width:70ch}
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.ucard{background:color-mix(in srgb,var(--u) 11%,var(--surface));border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ucard b{font:600 32px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--u)}
.ucard small{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--u);border-radius:3px}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.rank>h3{font-size:16px;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rrow{display:grid;grid-template-columns:28px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:10px 16px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--sunk)}
.rrow .rk{font:600 13px var(--mono);color:var(--muted)}
.rrow .nm{font-weight:600}
.rrow .mt{display:block;color:var(--muted);font-size:13px;font-weight:400}
.rrow .fr{font:600 12px var(--mono);text-align:right;color:var(--u)}
.rrow .meter{margin-top:4px}
.pri{font:600 11px/1 var(--mono);padding:4px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.pri.a{color:var(--hot);background:color-mix(in srgb,var(--hot) 13%,var(--surface))}
.pri.b{color:var(--heat-mid);background:color-mix(in srgb,var(--heat-mid) 15%,var(--surface))}
.pri.c{color:var(--muted);background:var(--sunk)}
@media (max-width:520px){.rrow{grid-template-columns:22px minmax(0,1fr) 74px}}
.heat td{text-align:center;font-variant-numeric:tabular-nums}
.heat td.h{background:color-mix(in srgb,var(--accent) calc(var(--v)*1%),var(--surface))}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 18px 6px 38px;margin:0}
.plan li{margin:10px 0}

/* hot topics */
.utabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.utabs button{border:2px solid transparent;background:color-mix(in srgb,var(--u) 13%,var(--surface));color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px}
.utabs button[aria-selected="true"]{border-color:var(--u)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hcard:hover{border-color:var(--h);box-shadow:var(--shadow)}
.hcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hcard.hi,.lg.hi{--h:var(--heat-hi)}.hcard.mid,.lg.mid{--h:var(--heat-mid)}.hcard.lo,.lg.lo{--h:var(--heat-lo)}
.hn{font:700 15.5px/1.3 var(--body);flex:1}
.hbar{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px;background:var(--h)}
.hmeta{display:flex;justify-content:space-between;gap:8px;align-items:baseline;color:var(--muted);font-size:13px;flex-wrap:wrap}
.hmeta b{font:600 13px var(--mono);color:var(--h)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.legend i.lg{display:inline-block;width:26px;height:8px;border-radius:4px;background:var(--h);margin-right:5px}
.hm{font-size:13px}
.hm th,.hm td{padding:5px 6px}
.hm thead th{font:600 11px/1.25 var(--mono);text-align:center;vertical-align:bottom;white-space:nowrap}
.hm thead th:first-child{text-align:left}
.hm tbody th{background:var(--surface);font-weight:600;min-width:190px;cursor:pointer}
.hm tbody th:hover{text-decoration:underline}
.hm td{text-align:center;font:600 12px var(--mono);min-width:44px;white-space:nowrap}
.hm td.on{background:color-mix(in srgb,var(--u) calc(var(--v)*1%),var(--surface))}
.hm td.off{color:var(--line)}
.hm td.sum{color:var(--u)}

/* state diagrams drawn from transition tables and move lists */
figure.fsm{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 6px}
figure.fsm figcaption{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--u);margin:2px 4px 4px}
figure.fsm .sc{overflow-x:auto;padding:4px 0}
figure.fsm svg{display:block;margin:0 auto;max-width:none}
figure.fsm .nd{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
figure.fsm .fin{fill:none;stroke:var(--ink);stroke-width:1.3}
figure.fsm .ed{fill:none;stroke:var(--accent);stroke-width:1.6}
figure.fsm .ah{fill:var(--accent)}
figure.fsm text{font-family:var(--mono);fill:var(--ink);text-anchor:middle}
figure.fsm text.el{font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
figure.fsm .key{font:12.5px var(--body);color:var(--muted);margin:2px 4px 2px}

/* playlist */
.vids{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;align-items:center}
.vids .lab{margin:0 4px 0 0}
a.vid{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
a.vid:hover{border-color:var(--accent);color:var(--accent)}
a.vid b{font:600 11.5px var(--mono);color:var(--accent)}
.vrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:8px}
.vrow .vn{font:600 22px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.vrow .vt{font-weight:700}

const A_OSI = `
<p><b>OSI (Open Systems Interconnection)</b> is ISO's 7-layer reference model. Each layer serves the layer above and uses the layer below; peers talk through headers added at the sender (encapsulation) and removed at the receiver (decapsulation).</p>
<div class="tw"><table>
<tr><th>#</th><th>Layer</th><th>Main job</th><th>Data unit</th><th>Examples</th></tr>
<tr><td>7</td><td>Application</td><td>Network services to user programs: mail, file transfer, web</td><td>Message</td><td>HTTP, FTP, SMTP, DNS</td></tr>
<tr><td>6</td><td>Presentation</td><td>Translation, encryption/decryption, compression</td><td>Message</td><td>SSL/TLS, JPEG, ASCII</td></tr>
<tr><td>5</td><td>Session</td><td>Dialog control, session setup/teardown, synchronisation points</td><td>Message</td><td>RPC, NetBIOS</td></tr>
<tr><td>4</td><td>Transport</td><td>Process-to-process delivery, port addressing, segmentation, flow and error control, connection control</td><td>Segment</td><td>TCP, UDP</td></tr>
<tr><td>3</td><td>Network</td><td>Source-to-destination delivery, logical (IP) addressing, routing</td><td>Packet</td><td>IP, ICMP, routers</td></tr>
<tr><td>2</td><td>Data link</td><td>Hop-to-hop delivery, framing, physical (MAC) addressing, flow/error/access control</td><td>Frame</td><td>Ethernet, HDLC, switches</td></tr>
<tr><td>1</td><td>Physical</td><td>Bits on the medium: signalling, data rate, synchronisation, topology, transmission mode</td><td>Bits</td><td>Cables, hubs, repeaters</td></tr>
</table></div>
<p><b>Diagram to draw:</b> two 7-layer stacks (sender, receiver) joined at the physical layer through intermediate nodes that have only layers 1–3; dashed peer-to-peer arrows between equal layers; headers H7…H2 and trailer T2 growing on the way down.</p>
<p><b>Data flow:</b> the application creates data → presentation encodes/encrypts → session adds sync points → transport splits into segments with port numbers → network adds IP addresses and picks a route → data link frames it with MAC addresses and a CRC trailer → physical sends bits. The receiver reverses every step. Layers 1–3 are network-support, 5–7 user-support, and layer 4 links the two groups.</p>`;

const A_TOPO = `
<p><b>Topology</b> is the physical or logical arrangement of links and nodes in a network.</p>
<div class="tw"><table>
<tr><th>Topology</th><th>Structure</th><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Mesh</td><td>Dedicated point-to-point link between every pair; n(n−1)/2 links, n−1 ports per device</td><td>No traffic sharing, robust, secure, easy fault isolation</td><td>Most cabling and ports, costly, hard to install</td></tr>

<tr><td>Tree / hybrid</td><td>Stars joined to a bus or to each other</td><td>Scalable, hierarchical</td><td>Depends on the root/backbone</td></tr>

const A_CLASS = `
<p><b>Classful addressing</b> splits the 32-bit IPv4 space into five fixed classes by the leading bits.</p>
<div class="tw"><table>
<tr><th>Class</th><th>First bits</th><th>First octet</th><th>Net / host bits</th><th>Default mask</th><th>Hosts per network</th></tr>
<tr><td>A</td><td>0</td><td>0–127</td><td>8 / 24</td><td class="m">255.0.0.0 (/8)</td><td>2²⁴ − 2</td></tr>
<tr><td>B</td><td>10</td><td>128–191</td><td>16 / 16</td><td class="m">255.255.0.0 (/16)</td><td>2¹⁶ − 2</td></tr>
<tr><td>C</td><td>110</td><td>192–223</td><td>24 / 8</td><td class="m">255.255.255.0 (/24)</td><td>254</td></tr>
<tr><td>D</td><td>1110</td><td>224–239</td><td colspan="3">Multicast, no net/host split</td></tr>
<tr><td>E</td><td>1111</td><td>240–255</td><td colspan="3">Reserved / experimental</td></tr>
</table></div>
<p><b>Classful subnetting</b> borrows host bits from the default mask, and every subnet uses the same mask (FLSM). Example: class C <span class="m">192.168.10.0</span>, borrow 2 bits → mask <span class="m">255.255.255.192</span>, 4 subnets (.0, .64, .128, .192) of 62 hosts each.</p>
<p><b>Classless addressing (CIDR)</b> drops the classes. A block is written <span class="m">a.b.c.d/n</span>, where n is any prefix length. Block size = 2^(32−n); first address = address AND mask; last = first OR inverted mask. Subnets can have different sizes (VLSM). Example: <span class="m">192.168.1.0/24</span> → <span class="m">/25</span> for 100 hosts, <span class="m">/26</span> for 50 hosts, <span class="m">/27</span> for 20 hosts.</p>
<p><b>Why classless is better:</b> (1) no waste — an organisation needing 2,000 addresses gets a /21 instead of a whole class B of 65,536; (2) slows IPv4 exhaustion; (3) <b>route aggregation (supernetting)</b> shrinks routing tables; (4) flexible subnet sizes with VLSM; (5) hierarchical allocation by ISPs.</p>
<p><b>Aggregation example:</b> <span class="m">192.168.0.0/24, 192.168.1.0/24, 192.168.2.0/24, 192.168.3.0/24</span> share their first 22 bits, so one route <span class="m">192.168.0.0/22</span> replaces four.</p>`;

const A_NAT = `
<p><b>Network Address Translation (NAT)</b> lets a site use private addresses internally (<span class="m">10.0.0.0/8</span>, <span class="m">172.16.0.0/12</span>, <span class="m">192.168.0.0/16</span>) and one or a few public addresses on the Internet. The NAT router rewrites the source address of outgoing packets and the destination address of incoming packets using a <b>translation table</b>.</p>
<ul>
<li><b>Static NAT:</b> one private address is mapped permanently to one public address (one-to-one). Used for servers that must be reachable from outside.</li>
<li><b>Dynamic NAT (pool of IP addresses):</b> the router owns a pool of public addresses, e.g. four. An inside host gets a free pool address when it starts a session. Only as many hosts as pool addresses can talk outside at once, and no two inside hosts can reach the same outside host with the same pool address at the same time.</li>
<li><b>PAT / NAPT / NAT overload (IP address + port):</b> many private hosts share <b>one</b> public address. The table stores private IP, private port, external IP, external port and protocol; the router gives each connection a unique translated source port, so replies can be matched back. This is what home routers use.</li>
</ul>
<div class="tw"><table>
<tr><th>Private address</th><th>Private port</th><th>External address</th><th>External port</th><th>Protocol</th></tr>
<tr><td class="m">172.18.3.1</td><td class="m">1400</td><td class="m">25.8.3.2</td><td class="m">80</td><td>TCP</td></tr>
<tr><td class="m">172.18.3.2</td><td class="m">1401</td><td class="m">25.8.3.2</td><td class="m">80</td><td>TCP</td></tr>
</table></div>
<p><b>Advantages:</b> saves public addresses, hides the internal network, lets a site change ISP without renumbering. <b>Limits:</b> breaks end-to-end connectivity, communication must start from inside (unless static/port-forwarding), adds processing at the router.</p>
<p><b>Diagram:</b> private LAN → NAT router → Internet, with the source address shown changing from <span class="m">172.18.3.1</span> to <span class="m">200.24.5.8</span> on the way out.</p>`;

const A_DEVICES = `
<div class="tw"><table>
<tr><th>Device</th><th>OSI layer</th><th>What it does</th><th>Used for</th></tr>
<tr><td>Repeater</td><td>Physical</td><td>Regenerates a weak signal bit by bit; 2 ports; no filtering</td><td>Extending cable length</td></tr>
<tr><td>Hub</td><td>Physical</td><td>Multiport repeater; sends every frame out of all ports; one collision domain</td><td>Small legacy LANs</td></tr>
<tr><td>Bridge</td><td>Data link</td><td>Joins two LAN segments, filters by MAC address, learns addresses, splits collision domains</td><td>Segmenting a LAN</td></tr>
<tr><td>Switch</td><td>Data link</td><td>Multiport bridge; <b>filtering table</b> of MAC address → port, learned from source addresses; forwards only to the right port</td><td>Modern Ethernet LANs, VLANs</td></tr>
<tr><td>Router</td><td>Network</td><td>Joins different networks; <b>routing table</b> of destination network → next hop/interface, built by routing protocols; splits broadcast domains; NAT, ACLs</td><td>LAN–WAN, Internet</td></tr>
<tr><td>Gateway</td><td>All layers</td><td>Protocol converter between dissimilar networks</td><td>e.g. mail or VoIP gateways</td></tr>
<tr><td>Modem / access point / NIC</td><td>Physical / data link</td><td>Modulation for the ISP line / wireless bridge to the LAN / host's network interface with a MAC address</td><td>Access</td></tr>
</table></div>
<p><b>Switch table vs router table:</b> a switch table holds flat 48-bit MAC addresses, is learned automatically, is valid only inside one LAN, and an unknown destination is flooded. A router table holds hierarchical IP prefixes with masks, is filled statically or by RIP/OSPF/BGP, uses longest-prefix match, has a default route, and an unknown destination is dropped (ICMP unreachable).</p>`;

const A_DVR = `
<p><b>Distance vector routing</b> (Bellman-Ford): every router keeps a table (vector) of the best known distance to every destination and the next hop for it.</p>
<ol>
<li><b>Initialise:</b> distance 0 to itself, link cost to neighbours, ∞ to everyone else.</li>
<li><b>Share:</b> each router sends its whole vector <b>only to its neighbours</b>, periodically (RIP: every 30 s) and when something changes.</li>
<li><b>Update</b> with the Bellman-Ford equation: <span class="m">D<sub>x</sub>(y) = min over neighbours v { c(x,v) + D<sub>v</sub>(y) }</span>. If a neighbour offers a shorter path, or the current next hop reports a new cost, the entry is replaced.</li>
<li>Repeat until no table changes (<b>convergence</b>).</li>
</ol>
<p><b>Example:</b> A–B = 2, B–C = 3, A–C = 7. First A has C = 7 (direct). B tells A “C is 3 away”; A computes 2 + 3 = 5 &lt; 7 and stores <i>C, cost 5, next hop B</i>. The route is rebuilt hop by hop: A hands the packet to B, and B's own table says C is direct.</p>
<p><b>Problems:</b> slow convergence and the <b>count-to-infinity</b> problem / routing loops when a link fails (“good news travels fast, bad news slowly”). <b>Fixes:</b> defining infinity as 16 (RIP), <b>split horizon</b> (do not advertise a route back to the neighbour it was learned from), <b>split horizon with poison reverse</b> (advertise it back with cost ∞), <b>triggered updates</b>, hold-down timers.</p>`;

const A_LSR = `
<p><b>Link state routing</b>: every router learns the <b>whole topology</b> and runs Dijkstra's algorithm on it.</p>
<ol>
<li><b>Discover neighbours</b> with Hello packets and measure link costs.</li>
<li><b>Build a link state packet (LSP/LSA)</b>: router ID, list of neighbours with costs, <b>sequence number</b> and <b>age</b>.</li>
<li><b>Flood</b> the LSP to all routers. A router forwards a new LSP on every interface except the one it came on and discards duplicates or older sequence numbers.</li>
<li>Every router now holds the same <b>link state database (LSDB)</b>.</li>
<li><b>Run Dijkstra</b> to get the shortest-path tree with itself as root, then build the forwarding table (destination → next hop).</li>
</ol>
<p><b>Age field:</b> each LSP carries an age that is decremented once per second and at each hop. When it reaches zero the LSP is discarded. This removes stale information if a router crashes or its sequence numbers get corrupted, and stops an LSP circulating forever.</p>
<p><b>Dijkstra:</b> start with the root in the tree. Repeatedly add the node with the smallest tentative distance, then relax its neighbours: <span class="m">D(v) = min( D(v), D(w) + c(w,v) )</span>, remembering the predecessor.</p>`;

const A_LSvsDV = `
<div class="tw"><table>
<tr><th>Point</th><th>Distance vector (RIP)</th><th>Link state (OSPF)</th></tr>
<tr><td>Knowledge</td><td>Only neighbours' distance tables</td><td>Full topology map (LSDB)</td></tr>
<tr><td>What is sent, to whom</td><td>Whole routing table, to neighbours only, every 30 s</td><td>Small LSAs about own links, flooded to all, only on change</td></tr>
<tr><td>Algorithm</td><td>Bellman-Ford</td><td>Dijkstra (SPF)</td></tr>
<tr><td>Convergence</td><td>Slow; count-to-infinity and loops</td><td>Fast; loop-free once databases agree</td></tr>
<tr><td>Scalability</td><td>Small networks; 15-hop limit</td><td>Large networks; areas give hierarchy</td></tr>
<tr><td>Metric</td><td>Hop count</td><td>Cost based on bandwidth</td></tr>
<tr><td>Resources</td><td>Little CPU/memory, more bandwidth for periodic updates</td><td>More CPU/memory, less bandwidth</td></tr>
</table></div>`;

const A_CRC = `
<p><b>Cyclic Redundancy Check</b> treats the data as a binary polynomial and uses <b>modulo-2 division</b> (XOR, no carries).</p>
<ol>
<li>Sender and receiver agree on a generator G of r+1 bits (degree r).</li>
<li>Sender appends r zeros to the k-bit data and divides by G using XOR.</li>
<li>The r-bit remainder is the CRC. It replaces the appended zeros: codeword = data + CRC.</li>
<li>Receiver divides the received codeword by the same G. Remainder 0 → accept; non-zero → error, discard.</li>
</ol>
<p><b>Detects:</b> all single-bit errors, all double-bit errors (good G), any odd number of errors if (x+1) is a factor of G, and all burst errors of length ≤ r.</p>`;

const A_ARQ = `
<p><b>ARQ (Automatic Repeat reQuest)</b> gives reliable delivery over a noisy link using four tools: <b>sequence numbers</b>, <b>acknowledgements</b> (ACK/NAK), a <b>timer</b>, and <b>retransmission</b>. A frame that is lost or damaged is never acknowledged, the sender's timer expires, and the frame is sent again; sequence numbers let the receiver drop duplicates and keep order.</p>
<div class="tw"><table>
<tr><th>Point</th><th>Stop-and-Wait</th><th>Go-Back-N</th><th>Selective Repeat</th></tr>
<tr><td>Sender window</td><td>1</td><td>2<sup>m</sup> − 1</td><td>2<sup>m−1</sup></td></tr>
<tr><td>Receiver window</td><td>1</td><td>1</td><td>2<sup>m−1</sup></td></tr>
<tr><td>Frames in transit</td><td>One; wait for its ACK</td><td>Up to N</td><td>Up to N</td></tr>
<tr><td>On error</td><td>Resend that frame after timeout</td><td>Resend the lost frame <b>and all frames after it</b></td><td>Resend <b>only</b> the lost frame (NAK)</td></tr>
<tr><td>Out-of-order frames</td><td>—</td><td>Discarded</td><td>Buffered</td></tr>
<tr><td>ACK</td><td>Per frame</td><td>Cumulative</td><td>Individual</td></tr>
<tr><td>Efficiency</td><td>1/(1+2a), poor on long links</td><td>Good on low-error links</td><td>Best on noisy links</td></tr>
<tr><td>Cost</td><td>Simplest</td><td>Simple receiver, wastes bandwidth on errors</td><td>Complex: buffers, sorting, more timers</td></tr>
</table></div>
<p><b>Sliding window:</b> the sender keeps a window of sequence numbers it may send without waiting. Each ACK slides the window forward, so several frames are in transit at once and the link is not idle during the round trip. This is why throughput is higher than Stop-and-Wait. ACKs can be <b>piggybacked</b> on data frames going the other way.</p>
<p><b>Diagrams:</b> a time-line for each: Stop-and-Wait with a lost frame and timeout; Go-Back-N where frame 2 is lost and 2, 3, 4 are resent; Selective Repeat where only frame 2 is resent after NAK 2.</p>`;

const A_CSMA = `
<p><b>CSMA</b> = “sense before transmit”. Collisions can still happen because of propagation delay.</p>
<p><b>CSMA/CD (wired Ethernet) — handles collisions after they happen:</b></p>
<ol>
<li>Sense the carrier. If idle, transmit; if busy, wait (1-persistent).</li>
<li>Keep listening while sending. If the signal on the cable differs from what is sent, a collision is detected.</li>
<li>Stop at once and send a 48-bit <b>jam signal</b> so every station knows.</li>
<li>Wait a random time from <b>binary exponential backoff</b>: after the n-th collision pick K in 0…2<sup>n</sup>−1 (n capped at 10), wait K × slot time (51.2 µs).</li>
<li>Try again; give up after 16 attempts.</li>
</ol>
<p>The frame must last at least 2 × propagation time, so the minimum Ethernet frame is 512 bits (64 bytes).</p>
<p><b>CSMA/CA (wireless, IEEE 802.11) — avoids collisions,</b> because a radio cannot listen while sending and hidden stations exist. Three strategies:</p>
<ul>
<li><b>Interframe space (IFS):</b> even if the channel is idle, wait DIFS before sending (SIFS for high-priority frames such as ACK/CTS).</li>
<li><b>Contention window:</b> then wait a random number of slots. The timer is frozen while the channel is busy and restarted when it is idle again. The window doubles after each failure.</li>
<li><b>Acknowledgement:</b> the receiver returns an ACK after SIFS. No ACK means resend.</li>
</ul>
<p><b>RTS/CTS and NAV:</b> the sender sends Request-To-Send, the receiver answers Clear-To-Send; both carry the duration. Other stations set their Network Allocation Vector and stay silent. This solves the <b>hidden terminal</b> problem.</p>
<p><b>Diagrams:</b> CSMA/CD flowchart (sense → send → collision? → jam → backoff); CSMA/CA time-line: DIFS, RTS, SIFS, CTS, SIFS, Data, SIFS, ACK with NAV bar for other stations.</p>`;

const A_TCPUDP = `

<tr><td>Header</td><td>20–60 bytes</td><td>8 bytes</td></tr>
<tr><td>Data unit</td><td>Segment (stream-oriented)</td><td>User datagram (message-oriented)</td></tr>

<p><b>TCP transmission:</b> SYN → SYN+ACK → ACK, then numbered bytes with cumulative ACKs; lost segments are resent on timeout or three duplicate ACKs; FIN/ACK closes each direction.</p>

const A_TCPSEG = `
<p><b>TCP segment</b> = 20–60 byte header + data.</p>
<pre>0                16               31
+----------------+----------------+
|  Source port   |  Dest. port    |
+----------------+----------------+
|         Sequence number         |
+---------------------------------+
|      Acknowledgement number     |
+----+------+------+--------------+
|HLEN|Resvd |Flags |  Window size |
+----+------+------+--------------+
|   Checksum     | Urgent pointer |
+----------------+----------------+
|      Options + padding (0–40 B) |
+---------------------------------+</pre>
<ul>
<li><b>Source / destination port (16 bits each):</b> identify the sending and receiving processes.</li>
<li><b>Sequence number (32):</b> number of the first data byte in this segment; the ISN during SYN.</li>
<li><b>Acknowledgement number (32):</b> next byte expected from the other side (cumulative).</li>
<li><b>HLEN (4):</b> header length in 4-byte words (5–15).</li>
<li><b>Flags (6):</b> URG, ACK, PSH, RST, SYN, FIN.</li>
<li><b>Window size (16):</b> receiver's free buffer (rwnd) for flow control.</li>
<li><b>Checksum (16):</b> over pseudo-header + header + data; mandatory.</li>
<li><b>Urgent pointer (16):</b> end of urgent data when URG is set.</li>
<li><b>Options:</b> MSS, window scale, timestamps, SACK.</li>
</ul>`;

const A_3WAY = `
<p><b>Connection establishment — three-way handshake:</b></p>
<ol>
<li><b>SYN:</b> client → server, SYN = 1, seq = x (client's ISN). Uses one sequence number, carries no data. Client is in SYN-SENT.</li>
<li><b>SYN + ACK:</b> server → client, SYN = 1, ACK = 1, seq = y, ack = x + 1. Server is in SYN-RCVD.</li>
<li><b>ACK:</b> client → server, ACK = 1, seq = x + 1, ack = y + 1. Both are ESTABLISHED; data can flow in both directions.</li>
</ol>
<p>The handshake synchronises both initial sequence numbers, confirms that both sides can send and receive, and exchanges window size and MSS. A SYN flood (many SYNs with fake source addresses) abuses step 2; SYN cookies defend against it.</p>`;

const A_4WAY = `
<p><b>Data transfer:</b> bytes are numbered; each segment carries seq = first byte and ack = next byte expected. ACKs are cumulative and usually piggybacked on data. PSH asks for immediate delivery; URG marks urgent data.</p>
<p><b>Connection termination — four-way handshake (with half-close):</b></p>
<ol>
<li>Client → server: <b>FIN</b>, seq = u. Client goes to FIN-WAIT-1.</li>
<li>Server → client: <b>ACK</b>, ack = u + 1. Client → FIN-WAIT-2. The server may still send its remaining data (half-close).</li>
<li>Server → client: <b>FIN</b>, seq = w, ack = u + 1. Server → LAST-ACK.</li>
<li>Client → server: <b>ACK</b>, ack = w + 1. Client waits 2 × MSL in TIME-WAIT, then both are CLOSED.</li>
</ol>
<p><b>Diagram:</b> two vertical time-lines (client, server) with the three SYN arrows, data/ACK arrows and the four FIN/ACK arrows, each labelled with seq and ack.</p>`;

const A_DNS = `
<p><b>Domain Name System</b> is the Internet's directory: a distributed, hierarchical database that maps host names to IP addresses. Users type <span class="m">www.example.com</span>; routers need <span class="m">93.184.216.34</span>. DNS is a client–server application on <b>port 53</b> (UDP for queries, TCP for responses over 512 bytes and zone transfers).</p>
<p><b>Components:</b></p>
<ul>
<li><b>Name space:</b> an inverted tree with the root at the top. Labels are up to 63 characters; a full name (FQDN) ends with the root dot. Domains: generic (<span class="m">com, org, edu</span>), country (<span class="m">in, uk</span>), inverse (<span class="m">in-addr.arpa</span>).</li>
<li><b>Name servers:</b> <b>root</b> servers (13 logical), <b>TLD</b> servers, <b>authoritative</b> servers that hold a zone's records (primary keeps the master file, secondary copies it by zone transfer), and <b>local/recursive resolvers</b> at the ISP.</li>
<li><b>Resolver:</b> the client routine in the host that sends queries.</li>
<li><b>Resource records</b> (A, AAAA, NS, CNAME, MX, SOA, PTR) and the <b>message format</b>: 12-byte header (ID, flags, counts) + question, answer, authority, additional sections.</li>
</ul>
<p><b>Resolution of www.example.com:</b></p>
<ol>
<li>Browser and OS check their caches and the hosts file.</li>
<li>The host asks its local DNS server (<b>recursive</b> query).</li>
<li>The local server asks a <b>root</b> server, which refers it to the <span class="m">.com</span> TLD servers.</li>
<li>The TLD server refers it to the authoritative server of <span class="m">example.com</span>.</li>
<li>The authoritative server returns the A record (these three are <b>iterative</b> queries).</li>
<li>The local server caches the answer for its TTL and replies to the host, which then opens a TCP connection to that address.</li>
</ol>
<p><b>Why it matters:</b> names are easy to remember, addresses can change without users noticing, one name can map to many servers (load balancing, CDNs), MX records route mail, and caching keeps lookups fast.</p>`;

const A_EMAIL = `
<p><b>Format of an e-mail:</b> an <b>envelope</b> (sender and receiver addresses used by SMTP) and a <b>message</b> made of a <b>header</b> (From, To, Cc, Subject, Date, Message-ID) and a <b>body</b>. An address is <span class="m">local-part@domain</span>. <b>MIME</b> lets the body carry non-ASCII text, images, audio and attachments by adding headers (MIME-Version, Content-Type such as text/html or image/jpeg, Content-Transfer-Encoding such as base64) and converting the data to 7-bit ASCII.</p>
<p><b>Architecture — three agents:</b></p>
<ul>
<li><b>User Agent (UA):</b> the mail program used to compose, read, reply and forward (Outlook, Gmail app).</li>
<li><b>Message Transfer Agent (MTA):</b> moves mail between mail servers with <b>SMTP</b> — a client MTA pushes, a server MTA receives. Mail waits in a spool queue and ends in the receiver's mailbox.</li>
<li><b>Message Access Agent (MAA):</b> pulls mail from the mailbox to the receiver's UA with <b>POP3</b> or <b>IMAP4</b>. It is needed because SMTP is a <b>push</b> protocol, while the receiver's PC is not always online and must <b>pull</b> its mail.</li>
</ul>
<p><b>Flow (common case, both users on LAN/WAN):</b> Alice's UA → (SMTP) → Alice's mail server → (SMTP over the Internet) → Bob's mail server → mailbox → (POP3/IMAP) → Bob's UA.</p>
<div class="tw"><table>
<tr><th>Protocol</th><th>Port</th><th>Role</th><th>Key points</th></tr>
<tr><td>SMTP</td><td>25 (587 for submission)</td><td>Sending: UA → server, server → server</td><td>Push; commands HELO, MAIL FROM, RCPT TO, DATA, QUIT; three phases: connection, transfer, termination</td></tr>
<tr><td>POP3</td><td>110</td><td>Retrieving</td><td>Simple; phases: authorization (USER/PASS), transaction (LIST, RETR, DELE), update; delete or keep mode; mail lives on one device</td></tr>
<tr><td>IMAP4</td><td>143</td><td>Retrieving</td><td>Mail stays on the server; folders, search, read headers before download, partial download, sync across devices</td></tr>
</table></div>
<p><b>Diagram:</b> Alice UA → MTA client → MTA server (Alice's server) → MTA client → Internet → MTA server (Bob's server) → MAA server ← MAA client ← Bob UA.</p>`;

const A_ERRDET = `
<p>Errors are <b>single-bit</b> or <b>burst</b>. Detection adds <b>redundant bits</b> that the receiver re-checks.</p>
<ul>
<li><b>Simple parity (VRC):</b> one extra bit makes the number of 1s even (or odd). Detects any odd number of bit errors; misses even numbers. Example: 1011 → even-parity codeword 1011<b>1</b>.</li>
<li><b>Two-dimensional parity (LRC):</b> data arranged in rows; a parity bit per row and per column. Detects up to 3 errors and most bursts; can locate a single error.</li>
<li><b>Checksum:</b> sender adds all 16-bit words in one's-complement arithmetic and sends the complement. Receiver adds everything including the checksum; all 1s (complement 0) means no error. Used by IP, TCP, UDP.</li>
<li><b>CRC:</b> append r zeros, divide by the generator with modulo-2 division, send the remainder as CRC. Receiver divides again; remainder 0 means accept. Catches all bursts ≤ r bits. Used by Ethernet (CRC-32).</li>
</ul>
<p><b>Correction:</b></p>
<ul>
<li><b>Retransmission (ARQ):</b> detect, then ask again — Stop-and-Wait, Go-Back-N, Selective Repeat.</li>
<li><b>Forward error correction — Hamming code:</b> r parity bits at positions 1, 2, 4, 8… with 2<sup>r</sup> ≥ m + r + 1. Each covers the positions whose binary index contains it. The receiver recomputes them; the syndrome gives the position of the wrong bit, which is flipped. Minimum distance 3: corrects 1-bit errors or detects 2-bit errors.</li>
</ul>
<p>Rule: to detect s errors the minimum Hamming distance must be s + 1; to correct t errors it must be 2t + 1.</p>`;

<p><b>Star vs Mesh for the company (Jul 2025 · II):</b> Mesh gives the highest reliability (no single point of failure, dedicated links) but needs n(n−1)/2 links and n−1 ports per device — 20 PCs need 190 links — so it scores badly on cost and scalability. Star needs n links, a new node is one more cable, and a faulty link isolates one PC only; its weakness, the central switch, is solved with a redundant/stacked switch. <b>Recommendation: star (extended star with redundant core switches)</b>, with a partial mesh only between the core switches/routers for backbone reliability.</p>` },

{ u:1, m:8, t:"OSI model — layers and their functions (8 mark versions)", items:[

<p><b>Role of the network layer (Jan 2024):</b> it delivers packets from source host to destination host across many networks. Duties: <b>logical addressing</b> (adds source and destination IP addresses), <b>routing</b> (routers choose the best path using routing tables built by RIP/OSPF/BGP), <b>forwarding</b> (moving the packet from input to the correct output interface), <b>packetizing</b> (encapsulating the segment in a datagram), <b>fragmentation and reassembly</b> when the next link's MTU is smaller, and <b>error reporting</b> through ICMP. Working: transport hands over a segment → IP header added → the host sends it to the default gateway → each router strips the frame, looks up the destination, decrements TTL and re-frames it for the next hop → the destination's network layer hands the segment up.</p>
<p><b>Layer-by-layer troubleshooting (May 2025)</b> — work bottom-up:</p>
<div class="tw"><table>
<tr><th>Layer</th><th>Typical fault / check</th><th>Performance and security action</th></tr>
<tr><td>Physical</td><td>Cable unplugged or damaged, link LED off, bad port; check with cable tester</td><td>Better cabling/fiber; lock wiring closets</td></tr>
<tr><td>Data link</td><td>Duplex/speed mismatch, CRC errors, wrong VLAN, MAC table, loops; <span class="m">show interfaces</span></td><td>Switches instead of hubs, STP; port security, 802.1X</td></tr>
<tr><td>Network</td><td>Wrong IP/mask/gateway, missing route; <span class="m">ping, traceroute</span></td><td>Good subnetting, dynamic routing; ACLs, firewalls, IPsec</td></tr>
<tr><td>Transport</td><td>Port blocked, retransmissions, congestion; <span class="m">netstat, telnet host port</span></td><td>Window tuning, QoS; firewall port filtering</td></tr>
<tr><td>Session</td><td>Sessions timing out, login failures</td><td>Timeouts, authentication</td></tr>
<tr><td>Presentation</td><td>Encoding or certificate/encryption mismatch</td><td>Compression; TLS</td></tr>
<tr><td>Application</td><td>DNS failure, service down, wrong config; <span class="m">nslookup</span>, logs</td><td>Caching, load balancing; patches, input validation</td></tr>
</table></div>` },

{ u:1, m:15, t:"OSI model — architecture, data flow, layer interaction (15 mark versions)", items:[
  {p:"m25", q:"26", x:"Imagine you are a network engineer at a company where the IT department is setting up a new communication system. Your manager asked you to provide a detailed explanation of the OSI model to ensure everyone understands how data travels through the network and the importance of each layer. So, you explain them."},

<p><b>For 15 marks write each layer as its own paragraph (2–3 functions each), draw the full diagram, then add:</b></p>
<p><b>Layer interaction:</b> each layer offers <b>services</b> to the layer above through an <b>interface</b> (service access point) and talks to its <b>peer</b> using a <b>protocol</b>. Going down, layer N takes the PDU of layer N+1 as its payload and adds its own header. Example: application data → transport adds ports and sequence numbers (segment) → network adds IP addresses (packet) → data link adds MAC addresses and CRC (frame) → physical turns it into signals. At every router only layers 1–3 are processed: the frame is checked and removed, the IP destination is looked up, and a new frame is built for the next link. The destination passes the data up, each layer removing its own header.</p>
<p><b>OSI vs TCP/IP (Nov 2025):</b></p>
<div class="tw"><table>
<tr><th>Point</th><th>OSI</th><th>TCP/IP</th></tr>
<tr><td>Layers</td><td>7</td><td>4 (or 5)</td></tr>
<tr><td>Origin</td><td>ISO; model first, protocols later</td><td>ARPANET/DoD; protocols first, model later</td></tr>
<tr><td>Upper layers</td><td>Separate application, presentation, session</td><td>All in one application layer</td></tr>
<tr><td>Transport</td><td>Connection-oriented only</td><td>TCP (connection-oriented) and UDP (connectionless)</td></tr>
<tr><td>Network</td><td>Connectionless and connection-oriented</td><td>Connectionless IP only</td></tr>
<tr><td>Services/interfaces/protocols</td><td>Clearly separated; protocol-independent</td><td>Not clearly separated; protocol-dependent</td></tr>
<tr><td>Use</td><td>Reference and teaching model</td><td>The working Internet standard</td></tr>
</table></div>` },

{ u:1, m:8, t:"TCP/IP protocol suite — layers and data flow between two hosts", items:[
  {p:"m24", q:"21a", x:"Using the internet in the figure shown (West coast office LAN – Router R1 – point-to-point WAN – Router R2 – East coast office LAN), show the layers of the TCP/IP protocol suite and the flow of data when two hosts, one on the west coast and the other on the east coast, exchange messages."}
], a: A_TCPIP + `
<p><b>Flow for the figure (host A, west LAN → R1 → WAN → R2 → east LAN, host B):</b></p>
<ol>
<li><b>Host A, all five layers:</b> application creates the message → transport adds a TCP/UDP header (segment) → network adds an IP header with A's and B's IP addresses (datagram) → data link adds a LAN frame header/trailer addressed to <b>R1's MAC</b> → physical sends bits on the west LAN.</li>
<li><b>Router R1, three layers:</b> physical receives bits, data link checks and removes the LAN frame, network looks up B's address in the routing table, then a <b>new frame</b> for the point-to-point WAN is built and sent.</li>
<li><b>Router R2, three layers:</b> removes the WAN frame, looks up the destination, builds a LAN frame addressed to <b>B's MAC</b> and sends it on the east LAN.</li>
<li><b>Host B, all five layers:</b> decapsulates upward: frame → datagram → segment → message delivered to the application.</li>
</ol>
<p><b>Key points:</b> IP addresses stay the same end to end; MAC addresses and the frame change at every hop. The link-layer switches inside each LAN use only two layers. Draw host A (5 layers), R1 (3), R2 (3), host B (5) with a U-shaped arrow passing down, across and up.</p>` },

{ u:1, m:15, t:"TCP/IP model with a neat diagram (15 marks)", items:[
  {p:"j24", q:"26", x:"Illustrate TCP/IP model with a neat diagram."}
], a: A_TCPIP + `
<p><b>Expand each layer for 15 marks:</b></p>
<ul>
<li><b>Physical + data link (network access):</b> no specific protocol is defined; any LAN/WAN technology works. Moves frames hop to hop using MAC addresses; framing, error detection, media access (CSMA/CD).</li>
<li><b>Internet layer:</b> <b>IP</b> is an unreliable, connectionless, best-effort datagram protocol; each datagram is routed independently. Helpers: <b>ARP</b> (IP → MAC), <b>ICMP</b> (error reporting, ping), <b>IGMP</b> (multicast groups).</li>
<li><b>Transport layer:</b> <b>TCP</b> — connection-oriented, reliable byte stream with flow, error and congestion control. <b>UDP</b> — connectionless, minimal overhead. <b>SCTP</b> — message-oriented, multi-stream, for telephony signalling.</li>
<li><b>Application layer:</b> HTTP, FTP, SMTP, POP3/IMAP, DNS, Telnet/SSH, DHCP, SNMP. Client–server or peer-to-peer.</li>
</ul>
<p><b>Encapsulation:</b> message → segment/user datagram → datagram → frame → bits. <b>Four address levels:</b> physical (MAC), logical (IP), port, and application-specific (URL, e-mail address).</p>
<p>End with the OSI vs TCP/IP comparison table (7 vs 4 layers; session and presentation merged into application; TCP/IP is protocol-dependent and practical).</p>` },

{ u:1, m:8, t:"Circuit switching vs packet switching", items:[
  {p:"m24", q:"21b", x:"(i) Why does a circuit-switched network need end-to-end addressing during the setup and teardown phases? Why are no addresses needed during the data transfer phase for this type of network? (4)  (ii) Why does a packet switching network need only end-to-end addressing during the data transfer phase, but no addressing during the setup and teardown phases? (4)"},
  {p:"n24", q:"21a", x:"Distinguish between Circuit Switching and Packet Switching techniques."},
  {p:"m26", q:"21a", x:"Differentiate between packet switching and circuit switching by explaining how each handles data transmission and resource allocation with neat diagram."}
], a: A_SWITCH + `
<p><b>May 2024 (i) — circuit switching:</b> in the <b>setup</b> phase the switches must find and reserve a path from caller to callee, so the request carries the end-to-end (source and destination) address; in <b>teardown</b> the same addresses identify which reserved resources to release. During <b>data transfer</b> a dedicated channel already exists on every link, so data simply follows the reserved circuit; the switches forward by the occupied time slot/frequency band and no address is needed.</p>
<p><b>May 2024 (ii) — packet (datagram) switching:</b> there are <b>no setup or teardown phases</b> at all: no path is reserved and resources are given on demand, so there is nothing to address in those phases. Every packet is routed independently by each router, which looks up the destination in its routing table, so <b>each packet must carry the full end-to-end destination address</b> during data transfer.</p>` },

{ u:1, m:8, t:"Guided media — twisted pair, coaxial cable, optical fiber", items:[
  {p:"m25", q:"21b", x:"Compare and contrast twisted pair cables and coaxial cables in terms of their construction, usage, and performance."},
  {p:"jl25a", q:"21b", x:"Compare and contrast twisted pair cables and coaxial cables in terms of their construction, usage and performance."},
  {p:"m26", q:"21b", x:"Compare twisted pair, coaxial cable, and optical fiber as transmission mediums in terms of data rate, distance, and susceptibility to noise. Explain which medium would be most suitable for a high-speed long-distance network and why?"}
], a: A_MEDIA + `
<p><b>Best for a high-speed long-distance network (May 2026): optical fiber.</b> It has the highest bandwidth, the lowest attenuation (repeaters every tens of km instead of every few hundred metres), complete immunity to electromagnetic interference and crosstalk, is light, and is hard to tap. The higher installation cost is justified on backbone and long-haul routes.</p>
<p><b>Sketches:</b> cross-sections of UTP (twisted pairs in a jacket), coax (core, insulator, braid, jacket) and fiber (core, cladding, jacket with a light ray reflecting).</p>` },

{ u:1, m:8, t:"Unguided (wireless) media for rural internet connectivity", items:[
  {p:"jl25b", q:"21b", x:"In a rural area with limited infrastructure, establishing internet connectivity poses significant challenges. Analyse the various types of unguided transmission media that can be used to deliver internet access in such an environment. Discuss their physical properties, performance characteristics and practical applications. Based on these factors determine the most suitable technology for this scenario."}
], a: `
<p>Unguided media carry electromagnetic waves through free space without a physical conductor.</p>
<div class="tw"><table>
<tr><th>Type</th><th>Frequency</th><th>Physical properties</th><th>Performance</th><th>Applications</th></tr>
<tr><td>Radio waves</td><td>3 kHz–1 GHz</td><td>Omnidirectional; ground and sky propagation; pass through walls</td><td>Low to moderate data rate; long range; prone to interference</td><td>AM/FM radio, TV, cordless phones, cellular (lower bands)</td></tr>
<tr><td>Microwaves (terrestrial)</td><td>1–300 GHz</td><td>Unidirectional, line of sight; dish/horn antennas on towers; blocked by hills, rain fade</td><td>High data rate; 30–50 km per hop with repeaters</td><td>Point-to-point backhaul, cellular, fixed wireless, WiMAX, Wi-Fi</td></tr>
<tr><td>Satellite microwave</td><td>C, Ku, Ka bands</td><td>Satellite acts as a relay; GEO at 36,000 km, LEO at 500–2,000 km</td><td>Covers any location; GEO has about 250 ms one-way delay; LEO has low delay</td><td>VSAT, DTH, LEO broadband</td></tr>
<tr><td>Infrared</td><td>300 GHz–400 THz</td><td>Short range, line of sight, cannot pass walls, affected by sunlight</td><td>High rate over a few metres</td><td>Remote controls, short indoor links</td></tr>
</table></div>
<p><b>Choice for the rural area:</b> infrared is ruled out (range). Laying cable/fiber is the costly part the question wants to avoid. The practical design is <b>terrestrial microwave / fixed wireless (4G/5G or point-to-multipoint radio) from the nearest fiber point to a village tower</b>, then Wi-Fi to homes, because it gives high data rates at low cost per user with only towers to build. Where hills or distance block line of sight, <b>satellite (VSAT or LEO)</b> is the fallback since it needs no ground infrastructure at all. State one as your final answer and justify it with coverage, cost, data rate and terrain.</p>` },

  {p:"n25", q:"21a", x:"Compare and contrast LAN, MAN, WAN, and PAN in terms of coverage, usage, and examples."}
], a: `
<div class="tw"><table>
<tr><th>Point</th><th>PAN</th><th>LAN</th><th>MAN</th><th>WAN</th></tr>
<tr><td>Coverage</td><td>Around one person, about 10 m</td><td>Room, building, campus; up to a few km</td><td>A city; 10–50 km</td><td>Country, continent, world</td></tr>
<tr><td>Ownership</td><td>Individual</td><td>Private organisation</td><td>Private or public (ISP, cable operator)</td><td>Service providers; often leased</td></tr>
<tr><td>Speed</td><td>Low to moderate</td><td>High (100 Mbps–10 Gbps)</td><td>Moderate to high</td><td>Lower per link, varies</td></tr>
<tr><td>Delay / error rate</td><td>Very low</td><td>Low</td><td>Moderate</td><td>Higher</td></tr>
<tr><td>Technology</td><td>Bluetooth, USB, Zigbee, NFC</td><td>Ethernet, Wi-Fi</td><td>Metro Ethernet, cable TV network, WiMAX, DQDB</td><td>MPLS, leased lines, satellite, SONET</td></tr>
<tr><td>Usage</td><td>Linking personal devices</td><td>Sharing files, printers, Internet in one site</td><td>Linking LANs across a city</td><td>Linking LANs/MANs across long distances</td></tr>
<tr><td>Example</td><td>Phone ↔ earbuds, smartwatch</td><td>College lab, office, home network</td><td>City-wide cable TV/ISP network, campuses of one university in a city</td><td>The Internet, a bank's national network</td></tr>
<tr><td>Cost / setup</td><td>Very low</td><td>Low</td><td>High</td><td>Very high</td></tr>
</table></div>
<p>Two WAN types: <b>point-to-point WAN</b> (connects two devices) and <b>switched WAN</b> (many end points through switches). An <b>internetwork</b> is two or more networks joined by routers.</p>` },

{ u:1, m:8, t:"Bandwidth, latency and the components of delay", items:[
  {p:"n25", q:"21b", x:"Define Bandwidth and Latency. Identify the different components of delay in data communication."}
], a: `
<p><b>Bandwidth</b> has two meanings: in hertz, the range of frequencies a channel can pass (highest − lowest); in bits per second, the maximum number of bits the link can send per second. <b>Throughput</b> is the rate actually achieved and is ≤ bandwidth.</p>
<p><b>Latency (delay)</b> is the time for an entire message to arrive completely at the destination, measured from when its first bit leaves the source.</p>
<p class="f">Latency = propagation time + transmission time + queueing time + processing delay</p>
<ul>
<li><b>Propagation time</b> = distance ÷ propagation speed. Time for one bit to travel the link (speed about 2 × 10⁸ m/s in cable).</li>
<li><b>Transmission time</b> = message size ÷ bandwidth. Time to push all the bits onto the link.</li>
<li><b>Queueing time:</b> time a packet waits in router/host buffers before it is processed or sent. It varies with load.</li>
<li><b>Processing delay:</b> time a node takes to check errors, read the header and choose the output link.</li>
</ul>
<p><b>Worked example:</b> a 2.5 kB message (20,000 bits) on a 1 Gbps link over 12,000 km: propagation = 12 × 10⁶ ÷ 2.4 × 10⁸ = 50 ms; transmission = 20,000 ÷ 10⁹ = 0.02 ms. Propagation dominates.</p>
<p><b>Related:</b> bandwidth-delay product = bits that can fill the link; <b>jitter</b> = variation in delay, which matters for audio and video.</p>` },

{ u:2, m:8, t:"Classful vs classless addressing and subnetting (CIDR)", items:[
  {p:"m24", q:"23a", x:"Brief about the process of classful and classless subnetting with examples."},
  {p:"m25", q:"23a", x:"Brief about the process of classful and classless subnetting with examples."},
  {p:"n25", q:"22b", x:"Explain Classful and Classless IPv4 addressing and discuss the advantages of Classless addressing over Classful addressing."},
  {p:"m26", q:"22b", x:"Explain how classless addressing (CIDR) improves IP address utilization compared to classful addressing. Give an example of aggregating networks using CIDR."}
], a: A_CLASS },

{ u:2, m:8, t:"CIDR — how many addresses in a /23 and a /25", items:[
  {p:"m24", q:"22a", x:"In contemporary routing and addressing, the notation commonly used is called classless interdomain routing or CIDR. With CIDR, the number of bits in the mask is indicated in the following fashion: 192.168.100.0/24. This corresponds to a mask of 255.255.255.0. If this example would provide for 256 host addresses on the network, how many addresses are provided with the following? (i) 192.168.100.0/23 (ii) 192.168.100.0/25"}
], a: `
<p class="f">Number of addresses = 2^(32 − n)</p>
<div class="tw"><table>
<tr><th>Block</th><th>Host bits</th><th>Mask</th><th>Addresses</th><th>Usable hosts</th><th>Range</th></tr>
<tr><td class="m">192.168.100.0/24</td><td>8</td><td class="m">255.255.255.0</td><td>256</td><td>254</td><td class="m">192.168.100.0 – 192.168.100.255</td></tr>
<tr><td class="m">192.168.100.0/23</td><td>9</td><td class="m">255.255.254.0</td><td><b>512</b></td><td>510</td><td class="m">192.168.100.0 – 192.168.101.255</td></tr>
<tr><td class="m">192.168.100.0/25</td><td>7</td><td class="m">255.255.255.128</td><td><b>128</b></td><td>126</td><td class="m">192.168.100.0 – 192.168.100.127</td></tr>
</table></div>
<p>Each bit removed from the prefix doubles the block (/23 is a supernet of two /24s). Each bit added halves it (/25 is half of the /24). The first address is the network address and the last is the broadcast address, so usable hosts = 2^(32−n) − 2.</p>` },

{ u:2, m:8, t:"Binary → dotted-decimal conversion and address class", items:[
  {p:"jl25b", q:"22a", x:"Convert the given IP addresses from binary notation to dotted decimal notation and identify its class and the default subnet mask: 1. 01101111 10100101 00011000 11001100  2. 10001100 11000001 11111111 00000000  3. 11000000 10101000 00000001 00000001  4. 11110000 10111111 01101101 00110011 (2 marks each)"},
  {p:"m26", q:"22a", x:"Change the following IP addresses from binary notation to dotted-decimal notation. Also find the class of each address. i. 10000001 00001011 00001011 11101111  ii. 11000001 10000011 00011011 11111111  iii. 11100111 11011011 10001011 01101111  iv. 11111001 10011011 11111011 00001111"}
], a: `
<p><b>Method:</b> convert each 8-bit group using weights 128 64 32 16 8 4 2 1. The class comes from the leading bits of the first octet: 0 → A, 10 → B, 110 → C, 1110 → D, 1111 → E.</p>
<p><b>Jul 2025 · II</b></p>
<div class="tw"><table>
<tr><th>Binary</th><th>Dotted decimal</th><th>Class</th><th>Default mask</th></tr>
<tr><td class="m">01101111 10100101 00011000 11001100</td><td class="m">111.165.24.204</td><td>A (starts 0)</td><td class="m">255.0.0.0</td></tr>
<tr><td class="m">10001100 11000001 11111111 00000000</td><td class="m">140.193.255.0</td><td>B (starts 10)</td><td class="m">255.255.0.0</td></tr>
<tr><td class="m">11000000 10101000 00000001 00000001</td><td class="m">192.168.1.1</td><td>C (starts 110)</td><td class="m">255.255.255.0</td></tr>
<tr><td class="m">11110000 10111111 01101101 00110011</td><td class="m">240.191.109.51</td><td>E (starts 1111)</td><td>None (reserved)</td></tr>
</table></div>
<p><b>May 2026</b></p>
<div class="tw"><table>
<tr><th>Binary</th><th>Dotted decimal</th><th>Class</th></tr>
<tr><td class="m">10000001 00001011 00001011 11101111</td><td class="m">129.11.11.239</td><td>B</td></tr>
<tr><td class="m">11000001 10000011 00011011 11111111</td><td class="m">193.131.27.255</td><td>C</td></tr>
<tr><td class="m">11100111 11011011 10001011 01101111</td><td class="m">231.219.139.111</td><td>D (multicast)</td></tr>
<tr><td class="m">11111001 10011011 11111011 00001111</td><td class="m">249.155.251.15</td><td>E (reserved)</td></tr>
</table></div>
<p>Show one conversion in full, e.g. 01101111 = 64 + 32 + 8 + 4 + 2 + 1 = 111.</p>` },

{ u:2, m:8, t:"Finding the block — number of addresses, first and last address", items:[
  {p:"n24", q:"22a", x:"Each of the following addresses belongs to a block. Find the first and the last address in each block. (i) 14.12.72.8/24 (ii) 200.107.16.17/18"},
  {p:"n25", q:"22a", x:"A classless address is given as 167.199.170.82/27. Find the number of addresses, first and last address in this network."}
], a: `
<p class="f">Addresses N = 2^(32−n) · First = address AND mask · Last = first OR (NOT mask)</p>
<p><b>167.199.170.82/27</b> — mask <span class="m">255.255.255.224</span>; 5 host bits.</p>
<ul>
<li>N = 2⁵ = <b>32 addresses</b></li>
<li>82 = <span class="m">010 10010</span>; keep the first 3 bits of the last octet → <span class="m">010 00000</span> = 64. First (network) address = <b class="m">167.199.170.64/27</b></li>
<li>Set the 5 host bits → <span class="m">010 11111</span> = 95. Last (broadcast) address = <b class="m">167.199.170.95/27</b></li>
<li>Usable hosts: <span class="m">167.199.170.65 – 167.199.170.94</span> (30 hosts)</li>
</ul>
<p><b>14.12.72.8/24</b> — mask <span class="m">255.255.255.0</span>. First = <b class="m">14.12.72.0</b>, last = <b class="m">14.12.72.255</b> (256 addresses).</p>
<p><b>200.107.16.17/18</b> — mask <span class="m">255.255.192.0</span>. Third octet 16 = <span class="m">00 010000</span>; keep 2 bits → 0. First = <b class="m">200.107.0.0</b>. Set the 14 host bits → third octet <span class="m">00 111111</span> = 63, fourth 255. Last = <b class="m">200.107.63.255</b> (2¹⁴ = 16,384 addresses).</p>` },

{ u:2, m:15, t:"167.199.170.82/27 — full block analysis (15 marks)", items:[
  {p:"m25", q:"27", x:"One of the addresses in a block is 167.199.170.82/27. Find the number of addresses in the network. Also find the network address, broadcast address, first host address and the last host address for the first two subnets."}
], a: `
<p><b>Step 1 — mask:</b> /27 = <span class="m">11111111.11111111.11111111.11100000</span> = <span class="m">255.255.255.224</span>. Host bits = 5.</p>
<p><b>Step 2 — number of addresses:</b> 2⁵ = <b>32</b> (30 usable hosts).</p>
<p><b>Step 3 — the block containing .82:</b> 82 = <span class="m">01010010</span>; AND with 224 (<span class="m">11100000</span>) = <span class="m">01000000</span> = 64.</p>
<div class="tw"><table>
<tr><th>Subnet</th><th>Network address</th><th>First host</th><th>Last host</th><th>Broadcast</th></tr>
<tr><td>Block containing the given address</td><td class="m">167.199.170.64/27</td><td class="m">167.199.170.65</td><td class="m">167.199.170.94</td><td class="m">167.199.170.95</td></tr>
<tr><td>Next /27 block</td><td class="m">167.199.170.96/27</td><td class="m">167.199.170.97</td><td class="m">167.199.170.126</td><td class="m">167.199.170.127</td></tr>
</table></div>
<p><b>The phrase “first two subnets” can also be read as</b> the first two /27 subnets of the class B network <span class="m">167.199.0.0</span> (11 subnet bits → 2,048 subnets). Add this table too, so that either reading gets marks:</p>
<div class="tw"><table>
<tr><th>Subnet</th><th>Network address</th><th>First host</th><th>Last host</th><th>Broadcast</th></tr>
<tr><td>1st</td><td class="m">167.199.0.0/27</td><td class="m">167.199.0.1</td><td class="m">167.199.0.30</td><td class="m">167.199.0.31</td></tr>
<tr><td>2nd</td><td class="m">167.199.0.32/27</td><td class="m">167.199.0.33</td><td class="m">167.199.0.62</td><td class="m">167.199.0.63</td></tr>
</table></div>
<p><b>Fill the 15 marks with:</b> the binary working for the AND and OR, the rule (block size 32 → networks at multiples of 32 in the last octet: 0, 32, 64, 96…), and a short note on CIDR notation and why the first and last addresses are not given to hosts.</p>` },

{ u:2, m:8, t:"FLSM — dividing a class C network into 4 equal subnets", items:[
  {p:"j24", q:"22b", x:"Consider, we have a big single network having IP Address 200.1.2.0. Divide this network into 4 subnets and find the following: a) IP address of the subnet b) Total number of IP addresses c) Total number of hosts d) First host address and last host address e) Direct and limited broadcast address."},
  {p:"jl25b", q:"22b", x:"Consider an organization that has been allocated with the address 192.168.10.0 and it needs to create exactly 4 subnets using FLSM. Perform the following tasks: 1. Determine the new subnet mask needed to achieve the required number of subnets. [2] 2. Calculate the total number of valid hosts per subnet. [2] 3. Construct a table listing the Network IDs, First Host ID, Last Host ID, Broadcast ID. [4]"}
], a: `
<p><b>Both are class C (/24).</b> 4 subnets need 2 borrowed bits (2² = 4).</p>
<ul>
<li>New mask = /26 = <b class="m">255.255.255.192</b></li>
<li>Host bits left = 6 → 2⁶ = <b>64 addresses</b> per subnet, <b>62 valid hosts</b> (64 − 2)</li>
<li>Block size 64 → subnets start at .0, .64, .128, .192</li>
</ul>
<p><b>192.168.10.0 (Jul 2025 · II)</b></p>
<div class="tw"><table>
<tr><th>Subnet</th><th>Network ID</th><th>First host</th><th>Last host</th><th>Broadcast</th></tr>
<tr><td>1</td><td class="m">192.168.10.0/26</td><td class="m">192.168.10.1</td><td class="m">192.168.10.62</td><td class="m">192.168.10.63</td></tr>
<tr><td>2</td><td class="m">192.168.10.64/26</td><td class="m">192.168.10.65</td><td class="m">192.168.10.126</td><td class="m">192.168.10.127</td></tr>
<tr><td>3</td><td class="m">192.168.10.128/26</td><td class="m">192.168.10.129</td><td class="m">192.168.10.190</td><td class="m">192.168.10.191</td></tr>
<tr><td>4</td><td class="m">192.168.10.192/26</td><td class="m">192.168.10.193</td><td class="m">192.168.10.254</td><td class="m">192.168.10.255</td></tr>
</table></div>
<p><b>200.1.2.0 (Jan 2024)</b></p>
<div class="tw"><table>
<tr><th>Subnet</th><th>Subnet address</th><th>First host</th><th>Last host</th><th>Direct broadcast</th></tr>
<tr><td>1</td><td class="m">200.1.2.0/26</td><td class="m">200.1.2.1</td><td class="m">200.1.2.62</td><td class="m">200.1.2.63</td></tr>
<tr><td>2</td><td class="m">200.1.2.64/26</td><td class="m">200.1.2.65</td><td class="m">200.1.2.126</td><td class="m">200.1.2.127</td></tr>
<tr><td>3</td><td class="m">200.1.2.128/26</td><td class="m">200.1.2.129</td><td class="m">200.1.2.190</td><td class="m">200.1.2.191</td></tr>
<tr><td>4</td><td class="m">200.1.2.192/26</td><td class="m">200.1.2.193</td><td class="m">200.1.2.254</td><td class="m">200.1.2.255</td></tr>
</table></div>
<p>Total IP addresses = 64 per subnet (256 in all); hosts = 62 per subnet. <b>Limited broadcast address</b> is <span class="m">255.255.255.255</span> for every subnet (never forwarded by routers). The direct broadcast address is the last address of each subnet.</p>` },

{ u:2, m:8, t:"VLSM and block allocation (8 mark versions)", items:[

<tr><td>Guest Wi-Fi</td><td>18</td><td>/27 (30)</td><td class="m">10.50.17.192/27</td><td class="m">255.255.255.224</td><td class="m">10.50.17.193</td><td class="m">10.50.17.222</td><td class="m">10.50.17.223</td></tr>
<tr><td>Lab</td><td>8</td><td>/28 (14)</td><td class="m">10.50.17.224/28</td><td class="m">255.255.255.240</td><td class="m">10.50.17.225</td><td class="m">10.50.17.238</td><td class="m">10.50.17.239</td></tr>
