{ u:2, m:8, t:"IPv4 datagram offsets, ARP package, ICMP (Dec 2023 only)", items:[
  {p:"d23", q:"21a", x:"(i) An IP packet has arrived in which the offset value is 100, the value of HLEN is 5 and the value of the total length field is 100. What is the number of the first byte and the last byte? (5)  (ii) List out the components of ARP packages and how the cache-control module is responsible for maintaining the cache table. (3)"},
  {p:"d23", q:"21b", x:"(i) Draw the ICMP header with proper values for “Source quench” type error reporting. (5)  (ii) Discuss about ICMP debugging tools. (3)"}
], a: `
<p><b>21(a)(i) Fragment bytes</b></p>
<ul>
<li>First byte = offset × 8 = 100 × 8 = <b>800</b></li>
<li>Header length = HLEN × 4 = 5 × 4 = 20 bytes</li>
<li>Data length = total length − header = 100 − 20 = 80 bytes</li>
<li>Last byte = 800 + 80 − 1 = <b>879</b></li>
</ul>
<p><b>21(a)(ii) ARP package</b> has five components: <b>cache table, queues, output module, input module, cache-control module</b>. The cache table holds entries with state (FREE, PENDING, RESOLVED), queue number, attempts, time-out, hardware address and protocol address. The <b>cache-control module</b> wakes up periodically and scans every entry: FREE → skip; PENDING → increment attempts, and if attempts exceed the maximum set the entry FREE and destroy its queue, otherwise resend the ARP request; RESOLVED → reduce time-out by the elapsed time, and if it is ≤ 0 set the entry FREE and destroy the queue.</p>
<p><b>21(b)(i) ICMP source-quench message</b> (flow/congestion warning to the source):</p>
<pre>+--------+--------+----------------+
| Type=4 | Code=0 |    Checksum    |
+--------+--------+----------------+
|        Unused (all 0s)           |
+----------------------------------+
| IP header of the dropped datagram|
|  + first 8 bytes of its data     |
+----------------------------------+</pre>
<p>A router or host that discards a datagram because of congestion sends this to the source, which should slow down.</p>
<p><b>21(b)(ii) Debugging tools:</b> <b>ping</b> sends ICMP echo request (type 8) and waits for echo reply (type 0); it reports reachability, round-trip time and packet loss. <b>traceroute / tracert</b> sends packets with TTL = 1, 2, 3…; each router that drops one returns ICMP <i>time exceeded</i> (type 11), revealing every hop; the destination finally returns <i>port unreachable</i> (type 3) or echo reply.</p>` },

/* ================= UNIT 3 ================= */
{ u:3, m:8, t:"Distance vector routing — working, example, routing loops (8 mark versions)", items:[
  {p:"jl24", q:"23b", x:"Draw and explain distance vector routing with a suitable example."},
  {p:"n24", q:"23b", x:"In a small network, three routers R1, R2, and R3 are connected in a triangular topology. Each router uses the distance-vector routing algorithm, like RIP, to share its routing table with its directly connected neighbours every 30 seconds. One day, the link between R1 and R2 fails. However, due to the nature of the distance-vector algorithm, R1 and R2 are not immediately aware of the link failure. R3 continues to send routing updates to R1 and R2 advertising a route to each other through itself. (i) How might a routing loop form in this network following the link failure between R1 and R2? (ii) Describe the mechanisms employed by the distance-vector routing protocol to prevent the formation of this routing loop."},
  {p:"jl25b", q:"23b", x:"Outline the concept of Distance Vector Routing, explaining its working principles with an example and appropriate diagrams."},
  {p:"m26", q:"23a", x:"Demonstrate how distance vector routing is performed using Bellman-Ford algorithm. Illustrate how route is reconstructed with examples."}
], a: A_DVR + `
<p><b>Nov 2024 (i) — how the loop forms:</b> before the failure, R3 learned its routes to R1's and R2's networks, and R1 and R2 also knew a 2-hop path to each other through R3. When the R1–R2 link (or a network behind it) goes down, R1 marks its direct route dead. But before R1's bad news reaches R3, R3's periodic update arrives saying “I can reach that network”. R1 does not know R3's route was learned from the failed side, so R1 installs it via R3 with cost + 1. R3, on hearing R1, raises its cost again. Packets for the dead destination bounce R1 → R3 → R1 … while the metric counts up 2, 3, 4 … (<b>count to infinity</b>) until it reaches 16.</p>
<p><b>(ii) Prevention:</b> (1) <b>maximum hop count</b> — 16 means unreachable, which bounds the counting; (2) <b>split horizon</b> — never advertise a route back through the interface it was learned on; (3) <b>poison reverse / route poisoning</b> — advertise a failed route (or a route back to its source) with metric 16; (4) <b>triggered updates</b> — send the change immediately instead of waiting 30 s; (5) <b>hold-down timer</b> — ignore worse news about a just-failed route for a while (RIP: 180 s).</p>` },

{ u:3, m:15, t:"Bellman-Ford / distance vector worked problems (15 marks)", items:[
  {p:"m24", q:"27", x:"Find the final convergence table for the following network using Bellman-Ford algorithm (figure: A–B 7, A–E 1, B–C 1, B–E 8, C–D 2, E–D 2). Assume the link between A and E is broken as shown. Explain the count to infinity problem that occurs due to this broken link and also prove split horizon with poison reverse is the solution."},
  {p:"n24", q:"27", x:"Consider a network using the Distance Vector routing protocol (e.g., RIP). The network initially consists of three routers, A, B, and C, with the following connections: A <-> B (cost 1), B <-> C (cost 2), A <-> C (cost 5). Router A wants to add a new connection to Router D with a cost of 3. How will the network update its routing tables, how will the routes to Router D be calculated by each router, and state the Distance Vector Routing Algorithm."}
], a: A_DVR + `
<p><b>May 2024 Q27 — final converged tables</b> (cost, next hop), link costs A–B 7, A–E 1, B–C 1, B–E 8, C–D 2, D–E 2:</p>
<div class="tw"><table>
<tr><th>From \\ To</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr>
<tr><th>A</th><td>0</td><td>6, E</td><td>5, E</td><td>3, E</td><td>1, E</td></tr>
<tr><th>B</th><td>6, C</td><td>0</td><td>1, C</td><td>3, C</td><td>5, C</td></tr>
<tr><th>C</th><td>5, D</td><td>1, B</td><td>0</td><td>2, D</td><td>4, D</td></tr>
<tr><th>D</th><td>3, E</td><td>3, C</td><td>2, C</td><td>0</td><td>2, E</td></tr>
<tr><th>E</th><td>1, A</td><td>5, D</td><td>4, D</td><td>2, D</td><td>0</td></tr>
</table></div>
<p>Note A reaches B by A–E–D–C–B = 1 + 2 + 2 + 1 = 6, cheaper than the direct link of 7; B reaches E through C (5), not the direct link of 8. Show the initial tables (direct links only) and one or two exchange rounds before the final table.</p>
<p><b>Count to infinity after A–E breaks:</b> E loses its cost-1 route to A. Before E can report that, D advertises “A at cost 3” — a route that itself runs through E. E does not know this and installs A = 2 + 3 = <b>5 via D</b>. D then hears E's 5 and updates to 7; E hears 7 and goes to 9; D to 11 … A packet for A bounces between D and E the whole time. The counting stops only when it passes the real alternative cost: E–D–C–B–A = 2 + 2 + 1 + 7 = <b>12</b> (with no alternative path it would count to infinity, i.e. 16 in RIP).</p>
<p><b>Split horizon with poison reverse fixes it:</b> D's next hop for A is E, so D advertises A to E with cost <b>∞</b>. Likewise C poisons A towards D, and B's route to A via C is poisoned towards C. When the link breaks, E has no neighbour offering a finite route, so it sets A = ∞ and tells D; D sets ∞ and tells C; C tells B. B then falls back to its direct link (7) and advertises it: C = 8, D = 10, E = 12. Final tables after the break: A→B 7, A→C 8, A→D 10, A→E 12. No loop and no slow counting.</p>
<p><b>Nov 2024 Q27 — adding D to A (cost 3):</b></p>
<div class="tw"><table>
<tr><th>Step</th><th>What happens</th><th>Route to D</th></tr>
<tr><td>Before</td><td>A: B 1, C 3 (via B, since 1 + 2 &lt; 5). B: A 1, C 2. C: B 2, A 3 (via B).</td><td>Nobody knows D</td></tr>
<tr><td>1</td><td>A detects the new link and adds D</td><td><b>A: D = 3, next hop D</b></td></tr>
<tr><td>2</td><td>A sends its vector (triggered update) to B and C. B: 1 + 3 = 4. C: 5 + 3 = 8.</td><td><b>B: D = 4 via A</b>; C: D = 8 via A (temporary)</td></tr>
<tr><td>3</td><td>B advertises D = 4 to C. C: 2 + 4 = 6 &lt; 8, replace.</td><td><b>C: D = 6 via B</b></td></tr>
<tr><td>4</td><td>D learns from A: A 3, B 4, C 6. No further change → converged.</td><td>D: all via A</td></tr>
</table></div>
<p>Each value uses D<sub>x</sub>(D) = min<sub>v</sub>{ c(x,v) + D<sub>v</sub>(D) }. State the four-step algorithm from the top of this answer as “the Distance Vector Routing Algorithm”.</p>` },

{ u:3, m:8, t:"Link state routing and Dijkstra — working, LS vs DV (8 mark versions)", items:[
  {p:"j24", q:"23a", x:"Explain how routing is performed using a link state algorithm. Illustrate with an example. Give the relevance of the age field in a link state packet."},
  {p:"jl25a", q:"23a", x:"What are the advantages of Link State Routing over Distance Vector Routing in terms of scalability and convergence speed?"},
  {p:"n25", q:"23a", x:"Illustrate the application of Dijkstra's algorithm in Link State Routing with a suitable example to show how the shortest path is computed."}
], a: A_LSR + `
<p><b>Small example to reproduce:</b> A–B 2, A–C 5, B–C 1, B–D 4, C–D 1. Root A.</p>
<div class="tw"><table>
<tr><th>Step</th><th>Tree (N′)</th><th>D(B), p</th><th>D(C), p</th><th>D(D), p</th></tr>
<tr><td>0</td><td>A</td><td>2, A</td><td>5, A</td><td>∞</td></tr>
<tr><td>1</td><td>A, B</td><td>—</td><td>3, B</td><td>6, B</td></tr>
<tr><td>2</td><td>A, B, C</td><td>—</td><td>—</td><td>4, C</td></tr>
<tr><td>3</td><td>A, B, C, D</td><td colspan="3">Done</td></tr>
</table></div>
<p>Shortest paths: A–B (2), A–B–C (3), A–B–C–D (4). Forwarding table of A: every destination has next hop B.</p>
<p><b>Advantages of link state over distance vector (Jul 2025 · I):</b></p>` + A_LSvsDV + `
<p><b>Scalability:</b> LSAs are small and sent only on change; areas (OSPF) limit flooding and SPF runs to one area; there is no 15-hop limit. <b>Convergence:</b> a change is flooded at once and every router recomputes independently on the same database, so there is no hop-by-hop rumour, no count to infinity and no transient loops.</p>` },

{ u:3, m:15, t:"Dijkstra shortest-path tree problems (15 marks)", items:[
  {p:"m24", q:"26", x:"Use Dijkstra's algorithm to find the shortest path tree and the forwarding table for node A in the following graph (figure). Write the advantages of this protocol in comparison to distance vector routing."},
  {p:"m26", q:"27", x:"Consider the network topology shown below. Using Dijkstra's Link State Algorithm, compute the shortest path tree from router F to all other routers in the network. Show the step-by-step table of tentative distances at each iteration. Identify the final shortest paths and their total costs. Briefly explain how the algorithm updates the distance and predecessor nodes during each step. (Figure: A–B 1, A–C 3, A–D 4, B–C 3, B–E 10, B–F 4, C–D 1, D–E 4, E–F 1)"}
], a: `
<p><b>May 2026 Q27 — fully solved, source F.</b> Links: A–B 1, A–C 3, A–D 4, B–C 3, B–E 10, B–F 4, C–D 1, D–E 4, E–F 1.</p>
<div class="tw"><table>
<tr><th>Step</th><th>Tree N′</th><th>D(A), p</th><th>D(B), p</th><th>D(C), p</th><th>D(D), p</th><th>D(E), p</th></tr>
<tr><td>0</td><td>F</td><td>∞</td><td>4, F</td><td>∞</td><td>∞</td><td><b>1, F</b></td></tr>
<tr><td>1</td><td>F, E</td><td>∞</td><td><b>4, F</b></td><td>∞</td><td>5, E</td><td>—</td></tr>
<tr><td>2</td><td>F, E, B</td><td><b>5, B</b></td><td>—</td><td>7, B</td><td>5, E</td><td>—</td></tr>
<tr><td>3</td><td>F, E, B, A</td><td>—</td><td>—</td><td>7, B</td><td><b>5, E</b></td><td>—</td></tr>
<tr><td>4</td><td>F, E, B, A, D</td><td>—</td><td>—</td><td><b>6, D</b></td><td>—</td><td>—</td></tr>
<tr><td>5</td><td>F, E, B, A, D, C</td><td colspan="5">All nodes permanent</td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Destination</th><th>Shortest path</th><th>Cost</th><th>Next hop from F</th></tr>
<tr><td>E</td><td>F → E</td><td>1</td><td>E</td></tr>
<tr><td>B</td><td>F → B</td><td>4</td><td>B</td></tr>
<tr><td>A</td><td>F → B → A</td><td>5</td><td>B</td></tr>
<tr><td>D</td><td>F → E → D</td><td>5</td><td>E</td></tr>
<tr><td>C</td><td>F → E → D → C</td><td>6</td><td>E</td></tr>
</table></div>
<p><b>Shortest-path tree:</b> F is the root with two branches: F–B–A and F–E–D–C.</p>
<p><b>How distances and predecessors are updated:</b> at each step the node w with the smallest tentative distance becomes permanent. For every neighbour v of w not yet in the tree, compute D(w) + c(w,v); if it is smaller than D(v), replace D(v) and set v's predecessor to w. Examples: at step 1, D via E = 1 + 4 = 5; B via E = 1 + 10 = 11 is worse than 4, so B keeps predecessor F. At step 4, C via D = 5 + 1 = 6 beats 7, so C's predecessor changes from B to D. Paths are read by following predecessors back to F.</p>
<p><b>May 2024 Q26:</b> the graph in the scan is too blurred to read the edge weights reliably, so no numeric answer is given here. Solve it exactly as above with A as the source: (1) table with one column per node, (2) pick the minimum each step and relax its neighbours, (3) draw the tree, (4) forwarding table with columns <i>Destination | Cost | Next hop</i>. Then write the advantages:</p>` + A_LSvsDV },

{ u:3, m:8, t:"OSPF link state advertisement types", items:[
  {p:"n24", q:"23a", x:"Explain what type of OSPF link state is advertised in each of the following cases: (i) A router needs to advertise the existence of another router at the end of a point-to-point link (ii) A designated router advertises a network as a node."}
], a: `
<p>OSPF routers describe the topology with <b>link state advertisements (LSAs)</b> flooded inside an area.</p>
<p><b>(i) Router link LSA (Type 1).</b> Every router generates one. It lists all the router's links with their type, link ID and cost. For a <b>point-to-point link</b>, the entry names the <b>neighbour router at the other end</b> (link ID = neighbour's router ID) and the cost. So a router advertises the existence of another router at the end of a point-to-point link with a <b>router link advertisement</b>.</p>
<p><b>(ii) Network link LSA (Type 2).</b> A transient (broadcast/multi-access) network such as an Ethernet with several routers is treated as a <b>node</b> in the graph. One router on it is elected <b>designated router (DR)</b>, and the DR generates the <b>network link advertisement</b> on behalf of the network: it gives the network address and mask and lists all routers attached to it.</p>
<div class="tw"><table>
<tr><th>Type</th><th>Name</th><th>Sent by</th><th>Describes</th><th>Scope</th></tr>
<tr><td>1</td><td>Router link</td><td>Every router</td><td>Its own links (point-to-point, transient, stub, virtual)</td><td>Area</td></tr>
<tr><td>2</td><td>Network link</td><td>Designated router</td><td>A multi-access network and the routers on it</td><td>Area</td></tr>
<tr><td>3</td><td>Summary link to network</td><td>Area border router</td><td>Networks outside the area</td><td>Into the area</td></tr>
<tr><td>4</td><td>Summary link to AS boundary router</td><td>Area border router</td><td>Route to the ASBR</td><td>Into the area</td></tr>
<tr><td>5</td><td>External link</td><td>AS boundary router</td><td>Networks outside the autonomous system</td><td>Whole AS</td></tr>
</table></div>
<p><b>Link types in a router LSA:</b> point-to-point (to a router), transient (to a network with several routers), stub (network with one router), virtual.</p>` },

{ u:3, m:15, t:"RIP (v1 and v2) vs OSPF — why OSPF for large networks", items:[
  {p:"n25", q:"27", x:"Critically examine the differences between RIP (v1 & v2) and OSPF. Evaluate why OSPF is preferred in large and complex networks, despite RIP's simplicity."}
], a: `
<div class="tw"><table>
<tr><th>Point</th><th>RIP v1</th><th>RIP v2</th><th>OSPF</th></tr>
<tr><td>Type</td><td colspan="2">Distance vector (Bellman-Ford)</td><td>Link state (Dijkstra SPF)</td></tr>
<tr><td>Metric</td><td colspan="2">Hop count; max 15, 16 = unreachable</td><td>Cost (reference bandwidth ÷ link bandwidth); no hop limit</td></tr>
<tr><td>Addressing</td><td>Classful; no mask in updates; no VLSM/CIDR</td><td>Classless; sends subnet mask; VLSM and CIDR</td><td>Classless; VLSM, CIDR, summarisation</td></tr>
<tr><td>Updates</td><td>Whole table every 30 s by <b>broadcast</b> 255.255.255.255</td><td>Whole table every 30 s by <b>multicast</b> 224.0.0.9; triggered updates</td><td>LSAs only on change (refresh every 30 min), multicast 224.0.0.5/6</td></tr>
<tr><td>Authentication</td><td>None</td><td>Plain text / MD5</td><td>Plain text / MD5 / SHA</td></tr>
<tr><td>Transport</td><td colspan="2">UDP port 520</td><td>Directly over IP, protocol 89</td></tr>
<tr><td>Convergence</td><td colspan="2">Slow (invalid 180 s, flush 240 s); count to infinity</td><td>Fast; Hello 10 s, dead 40 s</td></tr>
<tr><td>Hierarchy</td><td colspan="2">Flat</td><td>Areas around backbone area 0; ABR, ASBR, DR/BDR</td></tr>
<tr><td>Knowledge</td><td colspan="2">Neighbours' tables only (“routing by rumour”)</td><td>Complete topology database</td></tr>
<tr><td>Resources</td><td colspan="2">Little CPU/memory, more bandwidth</td><td>More CPU/memory, less bandwidth</td></tr>
<tr><td>Configuration</td><td colspan="2">Very simple</td><td>More complex design</td></tr>
</table></div>
<p><b>Why OSPF is preferred in large, complex networks:</b></p>
<ol>
<li><b>No size limit:</b> RIP cannot reach beyond 15 hops.</li>
<li><b>Better metric:</b> hop count ignores speed — RIP prefers one 64 kbps hop over two 1 Gbps hops; OSPF's cost follows bandwidth.</li>
<li><b>Fast, loop-free convergence:</b> changes are flooded immediately and each router recomputes from the same database; RIP may take minutes and can loop.</li>
<li><b>Low bandwidth use:</b> small event-driven LSAs instead of full tables every 30 s.</li>
<li><b>Hierarchy and scalability:</b> areas confine flooding and SPF, and summarisation at area borders keeps tables small.</li>
<li><b>Equal-cost load balancing, authentication, VLSM/CIDR support.</b></li>
</ol>
<p><b>Where RIP still fits:</b> small, stable networks with few routers, where its simplicity and low hardware demand matter more. <b>Conclusion:</b> OSPF costs more CPU, memory and design effort, but those costs are small next to the gains in convergence, scalability and path quality.</p>` },

{ u:3, m:8, t:"EIGRP — protocol, tables, DUAL, metric", items:[
  {p:"d23", q:"22a", x:"Refer to the exhibit (R1 with a primary link to ISP1/R2 and a secondary link to ISP2/R3). (i) Which technology can be employed to automatically detect a WAN primary link failure and failover to the secondary link? 1. HSRP 2. VRRP 3. IP SLA 4. multicast (2)  (ii) R1 is 3 router hops away from subnet 10.1.1.0/24. According to the show interfaces commands, all three links between R1 and 10.1.1.0/24 use the following settings: bandwidth: 1000, 500, 100000 and delay: 12000, 8000, 100. What delay and bandwidth value will be used to calculate the EIGRP metric? (6)"},
  {p:"m24", q:"23b", x:"Explain the EIGRP Protocol with required diagrams."},
  {p:"m25", q:"23b", x:"Explain the EIGRP Protocol with required diagrams."}
], a: `
<p><b>EIGRP (Enhanced Interior Gateway Routing Protocol)</b> is Cisco's <b>advanced distance vector (hybrid)</b> interior protocol. It keeps distance-vector simplicity but converges fast like link state. Classless (VLSM/CIDR), runs directly over IP (protocol 88), multicast 224.0.0.10, administrative distance 90.</p>
<p><b>Four components:</b> neighbour discovery/recovery (Hello every 5 s), <b>RTP</b> reliable transport, <b>DUAL</b> finite state machine, protocol-dependent modules (IPv4, IPv6).</p>
<p><b>Five packets:</b> Hello, Update, Query, Reply, Acknowledgement. Updates are partial and bounded — sent only when something changes and only to routers that need it.</p>
<p><b>Three tables:</b> <b>neighbour table</b> (adjacent routers), <b>topology table</b> (all routes learned from neighbours), <b>routing table</b> (best routes).</p>
<p><b>DUAL terms:</b></p>
<ul>
<li><b>Feasible distance (FD):</b> best total metric from this router to the destination.</li>
<li><b>Reported/advertised distance (RD):</b> the neighbour's own metric to the destination.</li>
<li><b>Successor:</b> the next hop with the lowest FD; goes in the routing table.</li>
<li><b>Feasible successor:</b> a backup next hop whose RD &lt; current FD (<b>feasibility condition</b>, guarantees no loop). If the successor fails, it is used instantly. If there is none, the route goes <b>active</b> and Queries are sent.</li>
</ul>
<p class="f">Metric (default K1 = K3 = 1) = 256 × ( 10⁷ ÷ minimum bandwidth in kbps + sum of delays in tens of µs )</p>
<p>Load and reliability (K2, K4, K5) are off by default. EIGRP also supports unequal-cost load balancing (variance).</p>
<p><b>Diagram:</b> router A reaching network X through B (FD 20, successor) and C (RD 15 &lt; 20, feasible successor), plus the three tables.</p>
<p><b>Dec 2023 Q22(a):</b> (i) <b>IP SLA</b> (option 3). It probes the ISP with ICMP echo and, with object tracking, removes the primary static route when the probe fails so the floating static route through the secondary link takes over. HSRP/VRRP give gateway redundancy between routers, not link tracking. (ii) EIGRP uses the <b>lowest bandwidth</b> on the path and the <b>cumulative delay</b>: bandwidth = <b>500</b> kbps; delay = 12000 + 8000 + 100 = <b>20100</b> µs (= 2010 tens of µs). Metric = 256 × (10⁷ ÷ 500 + 2010) = 256 × 22010 = 5,634,560.</p>` },

{ u:3, m:8, t:"BGP — path vector routing", items:[
  {p:"j24", q:"23b", x:"Explain how routing is done using BGP."}
], a: `
<p><b>Border Gateway Protocol (BGP-4)</b> is the Internet's <b>inter-domain (exterior)</b> routing protocol. It routes between <b>autonomous systems (AS)</b> using <b>path vector routing</b> and runs over <b>TCP port 179</b>.</p>
<p><b>Why not RIP/OSPF between ASes:</b> hop count is meaningless across ASes, flooding the whole Internet's topology does not scale, and ASes want <b>policy</b> (which networks they will carry traffic for), not just the shortest path.</p>
<p><b>Path vector idea:</b> each advertisement carries the destination prefix and the full <b>list of ASes on the path</b> (AS_PATH). A speaker node in each AS advertises its reachable networks to neighbouring ASes. When a router passes a route on, it adds its own AS number to the front.</p>
<ul>
<li><b>Loop prevention:</b> a router rejects any route whose AS_PATH already contains its own AS.</li>
<li><b>Policy routing:</b> a router can refuse or prefer paths that cross particular ASes.</li>
<li><b>Aggregation:</b> CIDR prefixes are summarised.</li>
</ul>
<p><b>Sessions:</b> <b>eBGP</b> between routers in different ASes; <b>iBGP</b> between routers inside one AS so that all of them learn external routes.</p>
<p><b>Four messages:</b> <b>OPEN</b> (start a session, exchange AS number and hold time), <b>UPDATE</b> (advertise new routes or withdraw old ones), <b>KEEPALIVE</b> (every 60 s), <b>NOTIFICATION</b> (error, close).</p>
<p><b>Path attributes:</b> well-known mandatory ORIGIN, AS_PATH, NEXT_HOP; plus LOCAL_PREF, MED (multi-exit discriminator), communities.</p>
<p><b>Route selection order:</b> highest LOCAL_PREF → shortest AS_PATH → lowest ORIGIN → lowest MED → eBGP over iBGP → nearest next hop.</p>
<p><b>Example:</b> AS1 advertises network N1 to AS2 with path (AS1). AS2 advertises it to AS3 with path (AS2, AS1). If AS3 also hears (AS4, AS5, AS1), it picks the shorter path unless its policy says otherwise.</p>` },

{ u:3, m:8, t:"IPv6 — features, header, IPv4 vs IPv6, transition, security", items:[
  {p:"d23", q:"24a", x:"Elaborate in brief about IPv6 routing protocols that enable routers to exchange information about connected networks. (Any 3 protocols)"},
  {p:"d23", q:"24b", x:"Draw and explain the three levels of hierarchy of global unicast address."},
  {p:"jl25a", q:"23b", x:"Discuss the security features of IPv6. How does it improve over IPv4 in terms of security?"},
  {p:"n25", q:"23b", x:"Analyze the major differences between IPv4 and IPv6 addressing. Why is IPv6 essential for the future of the internet?"},
  {p:"m26", q:"23b", x:"Describe about the features, packet format of IPV6 and translation procedure of IPV4 to IPV6 along with neat diagram."}
], a: `
<p><b>Features of IPv6:</b> 128-bit addresses (2¹²⁸), simpler fixed 40-byte base header, <b>extension headers</b> for options, no fragmentation by routers (source only), no header checksum, <b>stateless address autoconfiguration (SLAAC)</b>, built-in <b>IPsec</b>, flow label for QoS, no broadcast (unicast, multicast, anycast), better mobility.</p>
<p><b>Base header (40 bytes):</b></p>
<pre>+-------+-------------+---------------------+
|Version|Traffic class|     Flow label      |
| 4 bit |    8 bit    |       20 bit        |
+-------+------+------+----------+----------+
| Payload length (16) |Next hdr 8|Hop limit8|
+---------------------+----------+----------+
|        Source address (128 bits)          |
+-------------------------------------------+
|      Destination address (128 bits)       |
+-------------------------------------------+</pre>
<p>Next header says what follows: an extension header (hop-by-hop, routing, fragment, authentication, ESP, destination options) or TCP/UDP. Hop limit replaces TTL.</p>
<div class="tw"><table>
<tr><th>Point</th><th>IPv4</th><th>IPv6</th></tr>
<tr><td>Address</td><td>32 bits, dotted decimal</td><td>128 bits, 8 groups of hex with colons; zero compression (::)</td></tr>
<tr><td>Space</td><td>About 4.3 billion</td><td>3.4 × 10³⁸</td></tr>
<tr><td>Header</td><td>20–60 bytes, 12 fields, checksum</td><td>Fixed 40 bytes, 8 fields, no checksum</td></tr>
<tr><td>Configuration</td><td>Manual or DHCP</td><td>SLAAC or DHCPv6</td></tr>
<tr><td>Types</td><td>Unicast, multicast, broadcast</td><td>Unicast, multicast, anycast</td></tr>
<tr><td>Fragmentation</td><td>Routers and source</td><td>Source only</td></tr>
<tr><td>Security</td><td>IPsec optional</td><td>IPsec built in (AH, ESP)</td></tr>
<tr><td>NAT</td><td>Needed</td><td>Not needed; end-to-end addressing</td></tr>
<tr><td>Address resolution</td><td>ARP (broadcast)</td><td>Neighbour Discovery (ICMPv6, multicast)</td></tr>
</table></div>
<p><b>Why IPv6 is essential (Nov 2025):</b> IPv4 addresses are exhausted; billions of phones and IoT devices need unique addresses; it restores end-to-end connectivity without NAT, simplifies routing with hierarchical aggregation, and brings autoconfiguration, security and mobility.</p>
<p><b>Transition IPv4 → IPv6 (May 2026):</b></p>
<ul>
<li><b>Dual stack:</b> hosts and routers run both stacks; DNS decides which to use (AAAA → IPv6, A → IPv4).</li>
<li><b>Tunnelling:</b> two IPv6 hosts across an IPv4 region; the IPv6 packet is encapsulated inside an IPv4 packet (protocol 41) and decapsulated at the far end (6to4, Teredo).</li>
<li><b>Header translation (NAT64):</b> when the receiver understands only IPv4, a translator converts the IPv6 header to an IPv4 header using mapped addresses.</li>
</ul>
<p>Draw three small diagrams: dual-stack host; IPv6–IPv4 region–IPv6 tunnel; translator between IPv6 and IPv4 regions.</p>
<p><b>Security (Jul 2025 · I):</b> IPsec is part of the design: <b>Authentication Header</b> gives integrity and origin authentication; <b>Encapsulating Security Payload</b> gives confidentiality as well. End-to-end addressing without NAT lets IPsec work host to host. <b>SEND</b> with cryptographically generated addresses protects Neighbour Discovery against spoofing (the ARP-spoofing equivalent). The huge address space makes network scanning impractical. No broadcast removes broadcast-amplification (smurf) attacks. Privacy extensions give temporary random interface IDs.</p>
<p><b>Global unicast address — three-level hierarchy (Dec 2023):</b></p>
<pre>|<-- n = 48 bits -->|<- m = 16 ->|<----- q = 64 bits ----->|
| Global routing    | Subnet     | Interface identifier    |
| prefix            | identifier |                         |</pre>
<p><b>Global routing prefix</b> (first three bits 001, block 2000::/3) is assigned by registries/ISPs and routes the packet to the organisation's site. <b>Subnet ID</b> identifies one of up to 65,536 subnets inside the site. <b>Interface ID</b> identifies the host interface; it can be derived from the 48-bit MAC by EUI-64 (insert FFFE in the middle, flip the 7th bit), generated randomly, or set manually.</p>
<p><b>IPv6 routing protocols (Dec 2023):</b> <b>RIPng</b> — distance vector, hop count ≤ 15, UDP port 521, multicast FF02::9. <b>OSPFv3</b> — link state, runs per link, uses link-local addresses, multicast FF02::5/6, protocol 89. <b>EIGRP for IPv6</b> — DUAL, multicast FF02::A. <b>MP-BGP (BGP4+)</b> — multiprotocol extensions carry IPv6 prefixes between ASes.</p>` },

{ u:3, m:8, t:"Forwarding techniques — route method vs next-hop method", items:[
  {p:"jl25b", q:"23a", x:"Explain the route method and next-hop forwarding in detail, highlighting their differences with a suitable diagram."}
], a: `
<p><b>Forwarding</b> means placing a packet on its way to the destination by looking up a routing table. Storing complete routes makes tables huge, so several techniques shrink them.</p>
<p><b>Route method:</b> the routing table holds the <b>complete route</b> — every router on the way — for each destination.</p>
<p><b>Next-hop method:</b> the table holds <b>only the address of the next hop</b>. Each router on the path makes its own decision, and the tables of the routers together form the route.</p>
<p><b>Diagram:</b> Host A — R1 — R2 — Host B.</p>
<div class="tw"><table>
<tr><th>Table at</th><th>Route method (destination → route)</th><th>Next-hop method (destination → next hop)</th></tr>
<tr><td>Host A</td><td>Host B → R1, R2, Host B</td><td>Host B → R1</td></tr>
<tr><td>R1</td><td>Host B → R2, Host B</td><td>Host B → R2</td></tr>
<tr><td>R2</td><td>Host B → Host B</td><td>Host B → — (direct delivery)</td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Point</th><th>Route method</th><th>Next-hop method</th></tr>
<tr><td>Entry content</td><td>Full path</td><td>One address</td></tr>
<tr><td>Table size</td><td>Large</td><td>Small</td></tr>
<tr><td>When a link changes</td><td>Every table holding that path must be rewritten</td><td>Only nearby routers change</td></tr>
<tr><td>Consistency</td><td>Each node must know the whole topology</td><td>Each node knows only its neighbour toward the destination</td></tr>
<tr><td>Used in</td><td>Source routing</td><td>IP forwarding in practice</td></tr>
</table></div>
<p><b>Related techniques (add for full marks):</b> <b>network-specific method</b> — one entry for a whole network instead of one per host; <b>host-specific method</b> — an entry for one particular host (for control or security); <b>default method</b> — one entry (<span class="m">0.0.0.0/0</span>) for all destinations not listed.</p>` },

{ u:3, m:8, t:"Congestion control algorithms", items:[
  {p:"jl24", q:"23a", x:"What are the congestion control algorithms? Explain in detail."}
], a: `
<p><b>Congestion</b> occurs when the load on the network (packets sent) exceeds its capacity (packets it can handle); queues fill, delay rises and packets are dropped. Congestion control keeps load below capacity.</p>
<p><b>Open-loop (prevention):</b> retransmission policy, window policy (Selective Repeat is better than Go-Back-N), acknowledgement policy, discarding policy, admission policy.</p>
<p><b>Closed-loop (removal):</b> <b>backpressure</b> (a congested node stops accepting from its upstream node), <b>choke packet</b> (sent to the source, e.g. ICMP source quench), <b>implicit signalling</b> (source infers congestion from missing ACKs), <b>explicit signalling</b> (bits set in packets, forward or backward).</p>
<p><b>Traffic-shaping algorithms:</b></p>
<ul>
<li><b>Leaky bucket:</b> bursty input enters a bucket (queue); output leaves at a <b>constant rate</b>. If the bucket is full, packets are dropped. Smooths bursts but wastes idle time.</li>
<li><b>Token bucket:</b> tokens are added at rate r; the bucket holds at most c tokens; sending one packet uses one token. An idle host saves tokens and may later send a burst. Maximum burst time T satisfies <span class="m">c + rT = MT</span>, so T = c ÷ (M − r).</li>
</ul>
<p><b>TCP congestion control</b> uses a congestion window (cwnd); actual window = min(cwnd, rwnd):</p>
<ol>
<li><b>Slow start (exponential):</b> cwnd = 1 MSS, doubles every RTT until <b>ssthresh</b>.</li>
<li><b>Congestion avoidance (additive increase):</b> cwnd grows by 1 MSS per RTT.</li>
<li><b>Congestion detection (multiplicative decrease):</b> on <b>timeout</b>, ssthresh = cwnd ÷ 2, cwnd = 1, slow start again. On <b>three duplicate ACKs</b>, ssthresh = cwnd ÷ 2, cwnd = ssthresh (fast retransmit and fast recovery), continue with congestion avoidance.</li>
</ol>
<p><b>Graph:</b> cwnd against RTT: exponential rise, linear rise, drop to 1 after a timeout or to half after three duplicate ACKs (the saw-tooth).</p>` },
