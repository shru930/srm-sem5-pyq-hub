{ u:5, m:8, t:"Edge bounds — disconnected graphs and bipartite graphs", items:[
  {p:"m24", q:"25a", x:"Prove that the maximum number of edges in a simple disconnected graph G with n vertices and k components is (n − k)(n − k + 1)/2."},
  {p:"jl25a", q:"25a", x:"Prove that the maximum number of edges in a simple disconnected graph G with n vertices and k components is (n − k)(n − k + 1)/2."},
  {p:"jl25b", q:"25b", x:"Prove that maximum number of edges in a simple disconnected graph G with n vertices and k components is (n − k)(n − k + 1)/2."},
  {p:"m26", q:"25a", x:"Let G be a simple graph with n vertices and k connected components. Then prove that the maximum number of edges in G is (n − k)(n − k + 1)/2."},
  {p:"n24", q:"25a", x:"Prove that the maximum number of edges in a bipartite graph with n vertices is at most (n/2)²."},
  {p:"n25", q:"25a", x:"(i) Prove that the number of edges in a bipartite graph with n vertices is at most n²/4. (4 marks) (ii) Determine whether the graphs G and H are isomorphic. (4 marks) (Figure: G on U1…U5 with edges U1U3, U1U4, U1U5, U2U3, U2U5, U3U4; H on V1…V5 with edges V1V2, V1V3, V1V5, V2V3, V3V4, V4V5.)"}
], a: `
<p><b>Theorem</b> (May 2024, Jul 2025 · I, Jul 2025 · II, May 2026). A simple graph with n vertices and k components has at most (n − k)(n − k + 1)/2 edges.</p>
<p><i>Proof.</i> Let the components have n<sub>1</sub>, …, n<sub>k</sub> vertices, n<sub>1</sub> + … + n<sub>k</sub> = n, each n<sub>i</sub> ≥ 1. A simple component with n<sub>i</sub> vertices has at most n<sub>i</sub>(n<sub>i</sub> − 1)/2 edges (complete graph). So</p>
<p class="f">edges ≤ ½ Σ n<sub>i</sub>(n<sub>i</sub> − 1) = ½ (Σ n<sub>i</sub>² − n).</p>
<p>Now Σ (n<sub>i</sub> − 1) = n − k. Squaring, (Σ (n<sub>i</sub> − 1))² = Σ (n<sub>i</sub> − 1)² + (cross terms ≥ 0), so Σ (n<sub>i</sub> − 1)² ≤ (n − k)². Expanding the left side: Σ n<sub>i</sub>² − 2n + k ≤ (n − k)², i.e. Σ n<sub>i</sub>² ≤ (n − k)² + 2n − k. Therefore</p>
<p class="f">edges ≤ ½ [(n − k)² + 2n − k − n] = ½ [(n − k)² + (n − k)] = (n − k)(n − k + 1)/2.</p>
<p>Equality: k − 1 isolated vertices and one complete graph K<sub>n−k+1</sub>.</p>
<p><b>Bipartite graph: at most n²/4 edges</b> (Nov 2024, Nov 2025). Let the parts have x and n − x vertices. The most edges is when every vertex of one part is joined to every vertex of the other: x(n − x). Now x(n − x) = n²/4 − (x − n/2)² ≤ n²/4, with equality at x = n/2. So |E| ≤ (n/2)² = n²/4.</p>
<p><b>Nov 2025 (ii) isomorphism.</b> Both graphs have 5 vertices and 6 edges, and degree sequence (3, 3, 2, 2, 2). In G the degree-3 vertices U1, U3 are adjacent; in H, V1 and V3 are adjacent. Mapping U1 → V1, U3 → V3, U4 → V2, U2 → V4, U5 → V5 sends every edge to an edge: U1U3 → V1V3, U1U4 → V1V2, U1U5 → V1V5, U2U3 → V4V3, U2U5 → V4V5, U3U4 → V3V2. So <b>G and H are isomorphic</b>.</p>` },

{ u:5, m:8, t:"Graph isomorphism", items:[
  {p:"jl24", q:"25a", x:"Determine whether the following graphs are isomorphic, explain, and also find the adjacency matrix for G1 and G2. (Figure: G1 on 1…8 and G2 on a…h, each an outer square joined to an inner square.)"},
  {p:"m25", q:"25b", x:"Determine whether the following graphs are isomorphic or not. (Figure: G1 = outer rectangle A B C D with inner rectangle E F G H and edges BF, DH; G2 = outer rectangle O P Q R with inner rectangle S T U V and edges OS, RV.)"}
], a: `
<p><b>Isomorphism test.</b> Two graphs are isomorphic if there is a one-to-one correspondence of vertices that preserves adjacency. Necessary (invariant) checks: same number of vertices, edges, degree sequence, and the same pattern of adjacency among vertices of each degree. If an invariant differs, they are not isomorphic; if they agree, exhibit the mapping.</p>
<p><b>Jul 2024.</b> G1: outer square 1–2–3–8 and inner square 6–5–4–7 joined by 1–6, 2–5, 3–4, 8–7. G2 has the same shape: outer square a–d–c–h, inner square b–e–f–g, joined by a–b, d–e, c–f, h–g. (The figure prints the bottom-left vertex of G2 as “b” again; it is a separate vertex, called h here.) Both have 8 vertices, 12 edges, every degree 3, and both are the cube graph. The mapping 1 → a, 2 → d, 3 → c, 8 → h, 6 → b, 5 → e, 4 → f, 7 → g preserves every edge, so <b>G1 ≅ G2</b>. The adjacency matrices are then equal when rows and columns are written in the matched order:</p>
<pre>      1 2 3 4 5 6 7 8          a d c f e b g h
  1   0 1 0 0 0 1 0 1      a   0 1 0 0 0 1 0 1
  2   1 0 1 0 1 0 0 0      d   1 0 1 0 1 0 0 0
  3   0 1 0 1 0 0 0 1      c   0 1 0 1 0 0 0 1
  4   0 0 1 0 1 0 1 0      f   0 0 1 0 1 0 1 0
  5   0 1 0 1 0 1 0 0      e   0 1 0 1 0 1 0 0
  6   1 0 0 0 1 0 1 0      b   1 0 0 0 1 0 1 0
  7   0 0 0 1 0 1 0 1      g   0 0 0 1 0 1 0 1
  8   1 0 1 0 0 0 1 0      h   1 0 1 0 0 0 1 0</pre>
<p><b>May 2025.</b> Both graphs have 8 vertices, 10 edges and degree sequence (3, 3, 3, 3, 2, 2, 2, 2). Look at the degree-3 vertices: in G1 they are B, D, F, H and each has <b>exactly one</b> degree-3 neighbour (B–F, D–H). In G2 they are O, R, S, V, and O is adjacent to <b>two</b> degree-3 vertices (R and S). Adjacency between degree-3 vertices is preserved by any isomorphism, so <b>G1 and G2 are not isomorphic</b>.</p>` },

{ u:5, m:8, t:"Degrees, handshaking theorem and Eulerian graphs", items:[
  {p:"d23", q:"26", m:10, x:"(a) State and prove the handshaking theorem and also verify the theorem for the following graph. (Figure: house shape A, B, C with square A B E D and diagonals AE, BD meeting at F.) (b) Define Eulerian graph and give one example."},
  {p:"m25", q:"25a", x:"Find the number of vertices, the number of edges and the degree of each vertex from the following graph. Also verify the handshaking theorem. (Figure: vertices A, B, C, D, E, F.)"}
], a: `
<p><b>Handshaking theorem.</b> In any graph, Σ deg(v) = 2|E|.</p>
<p><i>Proof.</i> Every edge has two ends and contributes exactly 1 to the degree of each end (a loop contributes 2 to its vertex). So adding all degrees counts every edge twice. <b>Corollary:</b> the number of odd-degree vertices is even (the sum of degrees is even).</p>
<p><b>Dec 2023.</b> Vertices A, B, C, D, E, F (F is the crossing point of the diagonals). Edges: CA, CB, AB, AD, BE, DE, AF, FE, BF, FD — 10 edges. Degrees: A 4, B 4, C 2, D 3, E 3, F 4. Sum = 4 + 4 + 2 + 3 + 3 + 4 = 20 = 2 × 10 ✓.</p>
<p><b>Eulerian graph:</b> a connected graph with a closed walk (Euler circuit) that uses every edge exactly once. A connected graph is Eulerian ⇔ every vertex has even degree. Example: a cycle C<sub>4</sub>, or K<sub>5</sub> (every degree 4).</p>
<p><b>May 2025.</b> As read from the figure: edges AB, AC, BC, BE, BD, CE, CD, ED, EF — <b>6 vertices, 9 edges</b>. Degrees: A 2, B 4, C 4, D 3, E 4, F 1. Sum = 18 = 2 × 9 ✓. Odd-degree vertices D and F: two of them, an even number, as the corollary says.</p>` }
];

// Mark each paper's part of a shared answer: a paragraph that starts with a bold heading and names a paper
// (in its first 90 characters) opens a section for those papers; the text before the first one is common to all.
(function () {
  const names = PAPERS.map(p => [p.k, new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?!I)")]);
  TOPICS.forEach(t => {
    if (t.items.length < 2) return;
    const re = /<p>\s*<b>/g, cuts = []; let m;
    while ((m = re.exec(t.a))) {
      const end = t.a.indexOf("</p>", m.index), txt = t.a.slice(m.index, end).replace(/<[^>]+>/g, "").slice(0, 90);
      const ks = names.filter(([k, r]) => r.test(txt)).map(([k]) => k);
      if (ks.length) cuts.push([m.index, ks]);
    }
    if (!cuts.length) return;
    let out = t.a.slice(0, cuts[0][0]);
    cuts.forEach(([at, ks], i) => { out += '<div data-for="' + ks.join(",") + '">' + t.a.slice(at, i + 1 < cuts.length ? cuts[i + 1][0] : t.a.length) + "</div>"; });
    t.a = out;
  });
})();

/* ---------- progress ---------- */
function cheer(n){
  const f=n/totalQ;
  return n===0?"11 11 · this is your sign to start with one question"
    :f<.1?"you started. trust the process."
    :f<.25?"soft progress is still progress"
    :f<.5?"it is working. keep going."
    :f<.75?"more than halfway there"
    :f<1?"nearly done. finish what you started."
    :"every question done · wish granted";
}
function progress(){
  const n=done.size;
  $("#ring-n").textContent=n;$("#ring-t").textContent="of "+totalQ+" done";
  $("#ring-fg").style.strokeDashoffset=326.7*(1-n/totalQ);
  $("#ring").setAttribute("aria-label",n+" of "+totalQ+" questions revised");
  $("#cheer").textContent=cheer(n);
  document.querySelectorAll(".tcard").forEach(c=>{
    const ks=[...c.querySelectorAll(".pc")],d=ks.filter(k=>{const on=done.has(k.dataset.k);k.classList.toggle("d",on);return on}).length;
    const p=c.querySelector(".dn");p.hidden=!d;p.textContent=d===ks.length?"All done ✓":d+" of "+ks.length+" done";
  });
  document.querySelectorAll("#units .ut").forEach(b=>{
    const u=+b.dataset.u,qs=ALLQ.filter(r=>!u||r.t.u===u),d=qs.filter(r=>done.has(qk(r.x))).length;
    b.querySelector(".pb i").style.width=(qs.length?d/qs.length*100:0)+"%";b.querySelector(".c").textContent=d+" / "+qs.length+" done";
  });
}
function setDone(k,on){
  on?done.add(k):done.delete(k);store.set(KEY+"-doneq",[...done]);
  document.querySelectorAll('.qrow[data-k="'+k+'"]').forEach(r=>{r.classList.toggle("done",on);r.querySelector(".tick").setAttribute("aria-pressed",on);
    const b=r.querySelector(".doneb");if(b)b.textContent=on?"Done ✓ (undo)":"Mark as done"});
  progress();
}

/* ---------- one question's own answer ---------- */
const bcache=new Map();
const blocksOf=t=>{if(!bcache.has(t.a))bcache.set(t.a,splitBlocks(t.a));return bcache.get(t.a)};
const PRE=PAPERS.map(p=>({k:p.k,re:new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?!I)")}));
function answerFor(t,x){
  const B=blocksOf(t);let idx=[];const sp=MAP[qk(x)];
  if(sp){String(sp).split(",").forEach(s=>{const m=s.split("-").map(Number);for(let i=m[0];i<=(m.length>1?m[1]:m[0]);i++)if(i<B.length)idx.push(i)})}
  else if(t.items.length===1)idx=B.map((_,i)=>i);
  else if(B.some(b=>/^<div data-for="/.test(b)))B.forEach((b,i)=>{const m=/^<div data-for="([^"]*)"/.exec(b);if(!m||m[1].split(",").includes(x.p))idx.push(i)});
  else{
    // a part headed with other papers' names (and the tables under it) belongs to those papers' questions
    let hide=false;
    B.forEach((b,i)=>{
      if(/^<p[\s>]/.test(b)){
        const m=/^<p[^>]*>\s*<b>([\s\S]*?)<\/b>/.exec(b),txt=b.replace(/<[^>]+>/g,""),lead=m?m[1].replace(/<[^>]+>/g,""):(txt.length<70?txt:"");
        const ps=PRE.filter(r=>r.re.test(lead)).map(r=>r.k);hide=ps.length>0&&!ps.includes(x.p);
      }
      if(!hide)idx.push(i)});
    if(!idx.length)idx=B.map((_,i)=>i);
  }
  const set=new Set(idx);
  return{main:idx.map(i=>B[i]).join("\n"),rest:B.filter((_,i)=>!set.has(i)).join("\n"),n:B.length-set.size};
}
function answerPanel(t,x){
  const k=qk(x),a=answerFor(t,x),d=el("div","qa");
  d.appendChild(el("div","lab","Answer · "+mk(t,x)+" marks"));
  d.appendChild(el("div","ans",a.main));
  if(a.n&&t.items.length>1){const m=el("details","more",'<summary>Same topic, other papers’ versions ('+a.n+' more part'+(a.n>1?"s":"")+')</summary>');m.appendChild(el("div","ans",a.rest));d.appendChild(m)}
  const b=el("button","doneb",done.has(k)?"Done ✓ (undo)":"Mark as done");
  b.addEventListener("click",()=>setDone(k,!done.has(k)));d.appendChild(b);
  drawDiagrams(d);
  return d;
}
function qRow(t,x,withTopic){
  const k=qk(x),r=el("div","qrow u"+t.u+(done.has(k)?" done":""));r.dataset.k=k;r.id="q-"+k.replace(":","-");
  const h=el("div","qh",'<button class="tick" aria-label="Mark as done" aria-pressed="'+done.has(k)+'">✓</button><div><div class="qmeta"><span class="pill u">'+P[x.p].name+'</span><span class="pill">Q'+x.q+'</span><span class="pill">'+mk(t,x)+' marks</span>'+
    (withTopic?'<span class="pill">'+esc(t.fam)+'</span>':'')+'</div><div class="qtext">'+fmtQ(x.x)+'</div></div><span class="chev"></span>');
  h.tabIndex=0;h.setAttribute("role","button");
  const paint=()=>{const o=st.open.has(k);r.classList.toggle("open",o);h.setAttribute("aria-expanded",o);h.querySelector(".chev").textContent=o?"Hide ▲":"Answer ▼";
    const p=r.querySelector(".qa");if(o&&!p)r.appendChild(answerPanel(t,x));if(!o&&p)p.remove();};
  const toggle=()=>{st.open.has(k)?st.open.delete(k):st.open.add(k);paint()};
  h.addEventListener("click",e=>{if(e.target.closest(".tick")){setDone(k,!done.has(k));return}if(e.target.closest("a,table")&&window.getSelection().toString())return;toggle()});
  h.addEventListener("keydown",e=>{if(e.target!==h)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  r.appendChild(h);paint();return r;
}

function qmatch(t,x){
  if(st.unit&&!st.q&&t.u!==st.unit)return false;
  if(st.marks&&(st.marks==15)!==big(t,x))return false;
  if(st.paper&&x.p!==st.paper)return false;
  if(st.todo&&done.has(qk(x)))return false;
  if(st.fam&&t.fam!==st.fam)return false;
  if(st.q){const q=st.q.toLowerCase();if(!(t.t.toLowerCase().includes(q)||t.fam.toLowerCase().includes(q)||x.x.toLowerCase().includes(q)))return false}
  return true;
}

/* ---------- game plan ---------- */
function fams(){
  const m=new Map();
  TOPICS.forEach(t=>{const k=t.u+"|"+t.fam;if(!m.has(k))m.set(k,{u:t.u,name:t.fam,ps:new Set(),n8:0,n15:0,last:-1});
    const f=m.get(k);t.items.forEach(x=>{f.ps.add(x.p);big(t,x)?f.n15++:f.n8++;f.mk=(f.mk||0)+mk(t,x);f.last=Math.max(f.last,P[x.p].i)})});
  return [...m.values()].map(f=>Object.assign(f,{papers:f.ps.size,marks:f.mk}));
}
function pri(f){return f.papers>=5?'<span class="pri a">MUST DO</span>':f.papers>=3?'<span class="pri b">HIGH</span>':f.papers===2?'<span class="pri c">MEDIUM</span>':'<span class="pri c">ONCE</span>'}
function rrow(f,i,NP,withUnit){
  return '<button class="rrow u'+f.u+'" data-f="'+esc(f.name)+'" data-u="'+f.u+'"><span class="rk">'+i+'</span><span class="nm">'+esc(f.name)+pri(f)+'<span class="mt">'+(withUnit?"Unit "+f.u+" · ":"")+f.n8+' × 8m'+(f.n15?' · '+f.n15+' × 15m':'')+' · last asked '+PAPERS[f.last].name+'</span></span><span class="fr">'+f.papers+'/'+NP+' papers<div class="meter"><i style="width:'+f.papers/NP*100+'%"></i></div></span></button>';
}

/* ---------- state diagrams ----------
   Every transition table (and every list of PDA / Turing machine moves) in an answer also gets a drawn
   transition diagram: states on a circle, start arrow, double ring for final states, one arrow per pair
   of states with its labels merged. */
let fsmId=0;
function fsmSVG(N,E){
  // Textbook layout: states left to right in order; arrows to the right arch above, arrows to the left arch below,
  // self-loops sit on top of their state. Labels of the same pair of states are stacked.
  const id="ah"+(fsmId++),n=N.length,LH=14,CW=7.4,f=v=>v.toFixed(1);
  const M=new Map();E.forEach(e=>{const k=e.a+">"+e.b;if(!M.has(k))M.set(k,{a:e.a,b:e.b,l:[]});if(!M.get(k).l.includes(e.l))M.get(k).l.push(e.l)});
  const wid=l=>Math.max(...l.map(x=>x.length))*CW;
  N.forEach(s=>{const len=s.label.length;s.fs=len>9?10:len>6?11.5:13;s.rx=Math.max(22,len*s.fs*.31+10);s.ry=22});
  // gap between neighbours: wide enough for the labels that sit between them
  const gapAfter=N.map(()=>110);
  M.forEach(e=>{if(Math.abs(e.b-e.a)===1){const i=Math.min(e.a,e.b);gapAfter[i]=Math.max(gapAfter[i],wid(e.l)+60)}if(e.a===e.b){gapAfter[e.a]=Math.max(gapAfter[e.a],wid(e.l)/2+70);if(e.a)gapAfter[e.a-1]=Math.max(gapAfter[e.a-1],wid(e.l)/2+70)}});
  let x=0;N.forEach((s,i)=>{s.x=x;s.y=0;x+=gapAfter[i]});
  let g="",labels="",minX=-60,maxX=N[n-1].x+40,minY=-40,maxY=40;
  const text=(cx,cy,lines,up)=>{ // lines stacked away from the arrow: upward above, downward below
    const h=lines.length*LH,y0=up?cy-h+LH-3:cy+LH-2;
    labels+='<text class="el" x="'+f(cx)+'" y="'+f(y0)+'">'+lines.map((l,i)=>'<tspan x="'+f(cx)+'" dy="'+(i?LH:0)+'">'+esc(l)+'</tspan>').join("")+'</text>';
    const w=wid(lines)/2;minX=Math.min(minX,cx-w-6);maxX=Math.max(maxX,cx+w+6);minY=Math.min(minY,up?cy-h-4:cy);maxY=Math.max(maxY,up?cy:cy+h+6)};
  const onEdge=(s,tx,ty,m)=>{const dx=tx-s.x,dy=ty-s.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,t=1/Math.sqrt((ux/s.rx)**2+(uy/s.ry)**2)+(m||0);return[s.x+ux*t,s.y+uy*t]};
  M.forEach(e=>{
    const A=N[e.a],B=N[e.b];
    if(e.a===e.b){
      const p1=onEdge(A,A.x-14,A.y-60,1),p2=onEdge(A,A.x+14,A.y-60,4),top=A.y-A.ry-44;
      g+='<path class="ed" marker-end="url(#'+id+')" d="M'+f(p1[0])+" "+f(p1[1])+" C"+f(A.x-38)+" "+f(top)+" "+f(A.x+38)+" "+f(top)+" "+f(p2[0])+" "+f(p2[1])+'"/>';
      text(A.x,top+5,e.l,true);return}
    const span=Math.abs(e.b-e.a),right=e.b>e.a,rev=M.has(e.b+">"+e.a);
    const h=span===1&&!rev?0:(span===1?26:30+38*(span-1))*(right?-1:1);
    const mx=(A.x+B.x)/2,cy=A.y+2*h;
    const p1=onEdge(A,h?mx:B.x,h?cy:B.y,1),p2=onEdge(B,h?mx:A.x,h?cy:A.y,5);
    g+='<path class="ed" marker-end="url(#'+id+')" d="M'+f(p1[0])+" "+f(p1[1])+" Q"+f(mx)+" "+f(cy)+" "+f(p2[0])+" "+f(p2[1])+'"/>';
    const apex=.25*p1[1]+.5*cy+.25*p2[1];
    text(mx,right?apex-5:apex+5,e.l,right);
  });
  N.forEach(s=>{
    if(s.start){g+='<path class="ed" marker-end="url(#'+id+')" d="M'+f(s.x-s.rx-38)+" "+f(s.y)+" L"+f(s.x-s.rx-5)+" "+f(s.y)+'"/>'}
    g+='<ellipse class="nd" cx="'+f(s.x)+'" cy="'+f(s.y)+'" rx="'+f(s.rx)+'" ry="'+s.ry+'"/>'+(s.final?'<ellipse class="fin" cx="'+f(s.x)+'" cy="'+f(s.y)+'" rx="'+f(s.rx-4)+'" ry="'+(s.ry-4)+'"/>':'')+
      '<text x="'+f(s.x)+'" y="'+f(s.y+s.fs*.36)+'" font-size="'+s.fs+'">'+esc(s.label)+'</text>'});
  M.forEach(e=>{if(e.a!==e.b&&Math.abs(e.b-e.a)>1){const h=(30+38*(Math.abs(e.b-e.a)-1));e.b>e.a?minY=Math.min(minY,-h-8):maxY=Math.max(maxY,h+8)}});
  minX=Math.min(minX,N[0].x-N[0].rx-46);maxX=Math.max(maxX,N[n-1].x+N[n-1].rx+10);
  const W=maxX-minX+16,H=maxY-minY+16;
  return '<svg viewBox="'+f(minX-8)+" "+f(minY-8)+" "+f(W)+" "+f(H)+'" width="'+Math.round(W*1.2)+'" height="'+Math.round(H*1.2)+'" role="img" aria-label="Transition diagram"><defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>'+g+labels+'</svg>';
}
function tableFSM(tb){
  const rows=[...tb.rows];if(rows.length<3)return null;
  const H=[...rows[0].cells].map(c=>c.textContent.trim());
  if(!/state/i.test(H[0])||/incoming|sequence/i.test(H.join(" ")))return null;
  const cols=[];H.forEach((h,i)=>{if(i&&!/meaning|purpose|note/i.test(h))cols.push([i,h.replace(/^input\s+/i,"")])});
  if(!cols.length||cols.some(c=>c[1].length>6))return null;
  const moore=/output/i.test(H[0]),norm=x=>x.replace(/\s+/g,"");
  const N=rows.slice(1).map(r=>{let t=r.cells[0].textContent.trim();const start=/→/.test(t),final=/\*/.test(t);
    t=t.replace(/[→*]/g,"").replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim();
    return{k:norm(moore?t.split(" / ")[0]:t),label:t.replace(/^\{(\{[^{}]*\})\}$/,"$1"),start,final}});
  if(N.length>12||new Set(N.map(x=>x.k)).size!==N.length||N.some(x=>!x.k))return null;
  const K=new Map(N.map((x,i)=>[x.k,i])),E=[];
  if(!N.some(x=>x.start))N[0].start=true;
  for(let i=0;i<N.length;i++)for(const [ci,sym] of cols){
    const cell=rows[i+1].cells[ci];if(!cell)return null;let c=cell.textContent.replace(/\s+/g," ").trim(),out="";
    if(/^(∅|ϕ|φ|–|-|—)?$/.test(c)){if(K.has("∅"))E.push({a:i,b:K.get("∅"),l:sym});continue}
    const m=/^(.*?)\s*(?:\/|,\s*output)\s*(\S+)$/.exec(c);if(m&&!K.has(norm(c))){c=m[1];out=m[2]}
    let ts;if(K.has(norm(c)))ts=[norm(c)];else if(/^\{.*\}$/.test(c))ts=c.slice(1,-1).split(",").map(norm);else return null;
    if(ts.some(t=>!K.has(t)))return null;
    ts.forEach(t=>E.push({a:i,b:K.get(t),l:sym+(out?"/"+out:"")}));
  }
  return E.length?{N,E,kind:moore?"Moore machine":"Transition diagram"}:null;
}
function movesFSM(pre){
  const re=/\(([A-Za-z]\w*), ([^()→]*?)\)\s*→\s*\(([A-Za-z]\w*), ([^()]*?)\)/g,txt=pre.textContent,N=[],K=new Map(),E=[];let m,tm=0;
  const node=k=>{if(!K.has(k)){K.set(k,N.length);N.push({k,label:k,start:!N.length,final:/^(q?f\d*|q?acc\w*|qa|halt\w*)$/i.test(k)})}return K.get(k)};
  while((m=re.exec(txt))){const a=node(m[1]),b=node(m[3]);if(!m[2].includes(","))tm++;E.push({a,b,l:m[2].replace(/\s+/g,"")+" → "+m[4].replace(/\s+/g,"")})}
  if(E.length<3||N.length>12)return null;
  return{N,E,kind:tm>E.length/2?"Turing machine diagram":"PDA diagram",key:tm>E.length/2?"Arrow label: symbol read → symbol written, head move.":"Arrow label: input, stack top → what replaces the stack top (ε = pop)."};
}
function drawDiagrams(root){
  root.querySelectorAll(".ans table").forEach(tb=>{const m=tableFSM(tb);if(!m)return;
    const fig=el("figure","fsm",'<figcaption>'+m.kind+' · drawn from the table above</figcaption><div class="sc">'+fsmSVG(m.N,m.E)+'</div><div class="key">Arrow in = start state. Double ring = final state.</div>');
    (tb.closest(".tw")||tb).after(fig)});
  root.querySelectorAll(".ans pre").forEach(pre=>{const m=movesFSM(pre);if(!m)return;
    pre.after(el("figure","fsm",'<figcaption>'+m.kind+' · drawn from the moves above</figcaption><div class="sc">'+fsmSVG(m.N,m.E)+'</div><div class="key">'+m.key+' Arrow in = start state. Double ring = final state.</div>'))});
}

      const d=el("div","vrow"+(q?"":" cold"),'<span class="vn">'+String(v[0]).padStart(2,"0")+'</span><div><div class="vt">'+esc(v[1])+'</div><div class="vm">'+
        (q?'<span class="pill rep">In '+ps.size+' of '+PAPERS.length+' papers</span><span class="pill">'+q+' question'+(q>1?"s":"")+'</span>':'<span class="pill">Background only, not asked as a long question</span>')+'</div></div><a class="watch" target="_blank" rel="noopener" href="'+vurl(v)+'">Watch ▶</a>');
      const vm=d.querySelector(".vm");[...new Set(ts.map(t=>t.u+"|"+t.fam))].forEach(k=>{const [u,f]=k.split("|");const b=el("button","pill u u"+u,esc(f)+" →");b.addEventListener("click",()=>goFam(f,+u));vm.appendChild(b)});

<button class="sndb" id="sndb" aria-pressed="true" title="Sound on/off"></button>
<script>
(function(){
  var KEYS="dive-sound", on=true, ctx=null;
  try{ on=localStorage.getItem(KEYS)!=="off" }catch(e){}
  var b=document.getElementById("sndb");
  var icon=function(){ b.setAttribute("aria-pressed",on); b.setAttribute("aria-label",on?"Sound on":"Sound off");
    b.innerHTML='<svg viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="4" width="2" height="4"/><rect x="3" y="3" width="1" height="6"/><rect x="4" y="2" width="1" height="8"/><rect x="5" y="1" width="1" height="10"/>'+
      (on?'<rect x="7" y="5" width="1" height="2"/><rect x="8" y="3" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="9" y="4" width="1" height="4"/><rect x="10" y="2" width="1" height="8"/>'
         :'<rect x="7" y="4" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/><rect x="10" y="7" width="1" height="1"/><rect x="10" y="4" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/>')+'</svg>' };
  icon();
  function ac(){ if(!ctx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C() } if(ctx.state==="suspended") ctx.resume(); return ctx }
  // one note: wave type, start/end frequency, length (s), volume, delay (s)
  function tone(type,f1,f2,len,vol,delay){
    var c=ac(); if(!c) return; var t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); if(f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t+len);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+len+0.02);
  }
  var S={
    tab:function(){ tone("square",660,660,0.05,0.05); tone("square",990,990,0.06,0.04,0.05) },
    open:function(){ tone("sine",320,900,0.12,0.12); tone("sine",500,1300,0.09,0.06,0.07) },          // bubble going up
    close:function(){ tone("sine",900,300,0.12,0.10) },
    done:function(){ [523,659,784,1047].forEach(function(f,i){ tone("square",f,f,0.09,0.045,i*0.065) }) }, // coin arpeggio
    undo:function(){ tone("square",440,220,0.12,0.04) },
    blip:function(){ tone("square",880,880,0.035,0.035) },
    on:function(){ tone("square",523,523,0.06,0.05); tone("square",784,784,0.08,0.05,0.07) }
  };
  b.addEventListener("click",function(){ on=!on; try{ localStorage.setItem(KEYS,on?"on":"off") }catch(e){} icon(); if(on) S.on() });
  document.addEventListener("click",function(e){
    if(!on) return; var t=e.target.closest("button,a,summary,select,input[type=checkbox],[role=tab],.qh"); if(!t||t===b) return;
    if(t.matches(".tick,.doneb")){ var r=t.closest(".qrow"); setTimeout(function(){ (r&&r.classList.contains("done")?S.done:S.undo)() },0); return }
    if(t.matches("[role=tab],.pchips button,.utabs button,.seg button,.ut")) return S.tab();
    if(t.matches(".tcard>button,.qh,summary")){
      var box=t.closest(".tcard,.qrow,details");
      setTimeout(function(){ var now=box&&(box.matches("details")?box.open:(box.matches(".qrow")?box.classList.contains("open")||!!box.querySelector(".qa"):!!box.querySelector(".tbody"))); (now?S.open:S.close)() },0); return }
    S.blip();
  },true);
})();
</script>
